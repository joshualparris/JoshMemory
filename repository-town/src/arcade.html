<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repository Town · Arcade library</title><link rel="stylesheet" href="arcade.css"></head>
<body>
<header><a href="index.html">← Back to 3D town</a><span>REPOSITORY TOWN</span></header>
<main><p class="eyebrow">PLAY SOMETHING</p><h1>The arcade library.</h1><p>Jump into a game, roll the dice or explore a house’s exhibits. No 3D town required.</p>
<label for="filter">Find a game or house</label><input id="filter" type="search" placeholder="Try Carl, dice, safari or E4" autocomplete="off">
<nav aria-label="Library sections"><button id="games-tab" aria-pressed="true">Full games</button><button id="toys-tab" aria-pressed="false">Mini-games & exhibits</button></nav>
<p id="count" role="status">Loading the library…</p><div id="cards"></div></main>
<dialog id="exhibit" aria-labelledby="exhibit-title"><button id="close-exhibit" aria-label="Close exhibit">✕</button><h2 id="exhibit-title"></h2><div id="body"></div><div id="actions"></div></dialog>
<section id="game" hidden aria-label="Playing game"><div id="game-bar"><strong id="game-title"></strong><button id="game-exit">✕ Back to library</button></div><iframe id="game-frame" title="Game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></section>
<script type="module" src="arcade.js"></script></body></html>

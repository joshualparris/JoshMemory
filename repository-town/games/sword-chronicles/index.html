text appears at the bottom. Gold blocks labeled “Dungeon Master” are extra descriptive narration.\",\n      \"The bottom strip is your action bar: every button is something you can do right now. It can scroll if there are many options.\"\n    ]\n  },\n  {\n    title: \"Travel & map\",\n    paragraphs: [\n      \"Use Travel: … buttons to move only along roads the game allows from your current district. You cannot teleport; the World Map highlights where you may walk next.\",\n      \"Open World Map from the action bar to see districts as a diagram. Click a linked location to move there. Close with the button, clicking outside, or Escape.\"\n    ]\n  },\n  {\n    title: \"Talking & quests\",\n    paragraphs: [\n      \"Talk: … opens a conversation. Pick topic buttons, then Farewell to return to district actions. NPCs advance quests, shops, healing, and story.\",\n      \"Your first priority in a new game: use Talk: Captain Serra in Protector's Enclave to accept the main quest.\",\n      \"Quest Status in the action bar summarizes objectives. The Quests sidebar tab shows more detail.\"\n    ]\n  },\n  {\n    title: \"Sidebar tabs\",\n    paragraphs: [\n      \"Character — stats, HP, gold. Party — companions you recruited (portraits and HP). Inventory, Quests, Spells, Log, Help.\",\n      \"Help holds a short reference; you can open it anytime with the header Help button.\"\n    ]\n  },\n  {\n    title: \"Explore, market & crafting\",\n    paragraphs: [\n      \"Explore & Roleplay opens a long list of D&D-style actions: Perception, Investigation, sitting down, smelling the sea, and many more. These use dice when marked as skill checks.\",\n      \"Open Market appears in Market Square (Brom's shop). Use Crafting Bench appears in the Crafting Hall when you have the right materials for recipes—including the Warded Key.\"\n    ]\n  },\n  {\n    title: \"Combat\",\n    paragraphs: [\n      \"Some districts offer encounters; the final fight is at Mount Hotenow when you are ready. In combat you choose attacks, spells, potions, or flee.\",\n      \"After you act, any living companions strike, then the enemy acts. Natural 20s and 1s matter on your rolls. If you fall, you may wake in the Hall of Justice with penalties unless you have Revival Salt.\"\n    ]\n  },\n  {\n    title: \"Companions\",\n    paragraphs: [\n      \"Recruit up to two allies from the action bar when you are in the right district and meet their requirements (gold, quest progress, or having visited a place).\",\n      \"They travel with you, add banter when you move, fight after your turns, and can be knocked out until you Rest.\"\n    ]\n  },\n  {\n    title: \"Save, rest & shortcuts\",\n    paragraphs: [\n      \"Save anytime from the header; your game is stored in this browser. Rest spends gold and a day but refills HP, spell slots, and companions.\",\n      \"Number keys 1–9 trigger the matching visible action when possible. S saves, R rests (outside combat). Escape closes the World Map.\",\n      \"That is everything you need for a comfortable start. Good luck—and talk to Serra first.\"\n    ]\n  }\n];\n\n/** Shown in the story log once when you begin a brand-new adventure (after chapter title). */\nexport const NEW_GAME_ONBOARDING_DM = [\n  \"Before the first sword is drawn, take a breath and learn the table.\",\n  \"Everything you need is on one screen: the picture above is where you stand; the scrolling text is what happens; the buttons are what you can try next. If you ever feel lost, open Tutorial from the title screen before starting—or read the Help tab on the right.\",\n  \"Your first useful deed is simple: find Captain Serra here in Protector's Enclave and choose Talk. She names the quest that will carry you across Neverwinter.\"\n];\n\nexport const NEW_GAME_ONBOARDING_TIPS = [\n  \"Tip — Use the action buttons at the bottom. Start with Talk: Captain Serra.\",\n  \"Tip — Travel and World Map only connect districts that share a road; the map highlights valid moves.\",\n  \"Tip — Sheet / sidebar tabs hold character sheet, party, inventory, quests, and Help.\",\n  \"Tip — Explore & Roleplay adds optional skill checks and flavor (Perception, Investigation, etc.).\",\n  \"Tip — Press S to save; number keys 1–9 match the first nine action buttons.\"\n];\n"};

// src/core/dice.js
var DICE_PATTERN = /^(\d+)d(\d+)([+-]\d+)?$/i;
function rollDie(sides = 20) {
  if (!Number.isFinite(sides) || sides < 2) {
    throw new Error(`Invalid die: d${sides}`);
  }
  return Math.floor(Math.random() * sides) + 1;
}
function rollExpr(expr) {
  if (typeof expr === "number") {
    return { total: expr, rolls: [expr], modifier: 0, expr: String(expr) };
  }
  const normalized = String(expr || "").trim();
  const match = normalized.match(DICE_PATTERN);
  if (!match) {
    const asNumber = Number(normalized);
    if (!Number.isNaN(asNumber)) {
      return { total: asNumber, rolls: [asNumber], modifier: 0, expr: String(asNumber) };
    }
    throw new Error(`Invalid dice expression: ${expr}`);
  }
  const count = Number(match[1]);
  const sides = Number(match[2]);
  const modifier = match[3] ? Number(match[3]) : 0;
  if (count < 1 || count > 30) {
    throw new Error(`Unsupported die count: ${count}`);
  }
  const rolls = [];
  for (let i = 0; i < count; i += 1) {
    rolls.push(rollDie(sides));
  }
  const total = rolls.reduce((sum, value) => sum + value, 0) + modifier;
  return { total, rolls, modifier, expr: normalized };
}

}
function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) {
    return null;
  }
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") {
      return null;
    }
    if (parsed.version !== SAVE_VERSION) {
      return { incompatible: true, foundVersion: parsed.version ?? null };
    }
    if (!parsed.state || typeof parsed.state !== "object") {
      return null;
    }
    return { incompatible: false, state: parsed.state, savedAt: parsed.savedAt ?? null };
  } catch (_error) {
    return null;
  }
}

function abilityMod(score) {
  return Math.floor((Number(score) - 10) / 2);

function calculateMaxHp(classDef, abilities) {

function createInitialState(character, classDef, difficultyId = "medium") {

  const maxHp = baseMaxHp + diff.playerHpBonus;

}
function findInventoryItem(state2, itemId) {
  return state2.player.inventory.find((entry) => entry.itemId === itemId) || null;
}
function addItem(state2, itemId, qty = 1) {
  if (qty <= 0) {
    return;
  }
  const existing = findInventoryItem(state2, itemId);
  if (existing) {
    existing.qty += qty;
  } else {
    state2.player.inventory.push({ itemId, qty });
  }
}
function removeItem(state2, itemId, qty = 1) {
  const existing = findInventoryItem(state2, itemId);
  if (!existing || existing.qty < qty) {
    return false;
  }
  existing.qty -= qty;
  if (existing.qty <= 0) {
    state2.player.inventory = state2.player.inventory.filter((entry) => entry.itemId !== itemId);
  }
  return true;
}
function hasItems(state2, requirements) {
  return requirements.every((req) => {
    const entry = findInventoryItem(state2, req.itemId);
    return entry && entry.qty >= req.qty;
  });
}
function gainXp(state2, amount) {
  state2.player.xp += amount;
  const needed = state2.player.level * 120;
  if (state2.player.xp >= needed) {
    state2.player.level += 1;
    state2.player.maxHp += 5;
    state2.player.hp = state2.player.maxHp;
    return true;
  }
  return false;
}

  if (!nextState.ui.activeSidebarTab) {
    nextState.ui.activeSidebarTab = "character";
  }
  if (!nextState.ui.mode) {
    nextState.ui.mode = "default";

  if (nextState.ui.mode === "explore") {
    nextState.ui.mode = "default";
  }
  if (nextState.ui.mode !== "dialogue") {
    nextState.ui.dialogueNpcId = null;
  }
  if (!Array.isArray(nextState.party)) {
    nextState.party = [];

  if (nextState.world && !nextState.world.difficulty) {
    nextState.world.difficulty = "medium";

  if (!Array.isArray(nextState.log)) {
    nextState.log = [];
  }
  if (!nextState.player.status) {
    nextState.player.status = { markDice: null, markTurns: 0, acBoostTurns: 0 };

function dialogueTopicVisible(topic) {

    return false;
  }
  if (topic.needInactiveQuest && state.quests.active.includes(topic.needInactiveQuest)) {
    return false;
  }
  if (topic.needFlags) {
    for (const [flagKey, want] of Object.entries(topic.needFlags)) {
      const got = Boolean(state.world.flags[flagKey]);
      if (got !== want) {
        return false;

    }
  }
  return true;
}

function pickRandomExploreLine(lines) {

    return "";

  return lines[Math.floor(Math.random() * lines.length)];

function runExploreAction(actionId) {
  if (actionId === "exit") {
    return;
  }
  const def = exploreLookup[actionId];
  if (!def) {
    gameMessage("That action isn't available.", "system", true);
    return;
  }
  const locId = state.world.locationId;
  const locBlock = def.locations ? def.locations[locId] : null;
  if (def.kind === "flavor") {
    if (def.withPartyLines && state.party.some((m) => m.hp > 0)) {
      gameMessage(pickRandomExploreLine(def.withPartyLines), "prose", true);
      return;
    }
    let pool = [...def.lines || []];
    if (locBlock && locBlock.lines) {
      pool = [...locBlock.lines, ...pool];
    }
    const line = pickRandomExploreLine(pool);
    gameMessage(line || "A quiet moment passes.", "prose", true);
    return;
  }
  if (def.kind === "skill") {
    const mod = abilityMod(state.player.abilities[def.ability]);
    const roll = rollDie(20);
    const total = roll + mod;
    const naturalOne = roll === 1;
    const naturalTwenty = roll === 20;
    const success = naturalTwenty || !naturalOne && total >= def.dc;
    gameMessage(
      `${def.skill} \u2014 d20(${roll}) + ${mod} (${String(def.ability).toUpperCase()}) = ${total} vs DC ${def.dc}.`,
      "roll-result",
      true
    );
    if (naturalTwenty) {
      gameMessage("Natural 20 \u2014 inspiration strikes; the scene yields more than it should.", "success", true);
    } else if (naturalOne) {
      gameMessage("Natural 1 \u2014 something goes sideways: a slip, a misread, bad luck.", "failure", true);
    }
    let passPool = [...def.pass];
    let failPool = [...def.fail];
    if (locBlock) {
      if (locBlock.pass) {
        passPool = [...locBlock.pass, ...passPool];
      }
      if (locBlock.fail) {
        failPool = [...locBlock.fail, ...failPool];
      }
    }
    const line = success ? pickRandomExploreLine(passPool) : pickRandomExploreLine(failPool);
    if (line) {
      gameMessage(line, success ? "success" : "failure", true);
    }
  }
}

function handleAction(actionId) {
  if (!state) {
    return;
  }
  if (state.world.ending === "victory") {
    if (actionId === "ending:return") {
      switchScreen("title");
      state = null;
      return;
    }
    if (actionId === "ending:continue") {
      state.world.ending = null;
      gameMessage("You continue patrolling the Sword Coast.", "system", true);
      renderGame();
      return;
    }
  }
  if (state.combat) {
    handleCombatAction(actionId);
    renderGame();
    return;
  }
  if (state.ui.mode === "explore") {
    if (actionId === "explore:exit") {
      state.ui.mode = "default";
      renderGame();
      return;
    }
    if (actionId.startsWith("explore:")) {
      const sub = actionId.replace("explore:", "");
      if (sub && sub !== "exit") {
        runExploreAction(sub);
      }
      renderGame();
      return;
    }
  }
  if (actionId === "mode:shop") {
    state.ui.mode = "shop";
    gameMessage("Brom grins and opens his ledger.", "dialogue", true);
    renderGame();
    return;
  }
  if (actionId === "mode:craft") {
    state.ui.mode = "craft";
    gameMessage("Miri points to the forge and herb bench.", "dialogue", true);
    renderGame();
    return;
  }
  if (actionId === "mode:explore") {
    state.ui.mode = "explore";
    gameMessage("You take the scene seriously\u2014senses, skills, small rituals of being alive.", "system", true);
    renderGame();
    return;
  }
  if (actionId.startsWith("shop:")) {
    handleShopAction(actionId);
    renderGame();
    return;
  }
  if (actionId.startsWith("craft:")) {
    handleCraftAction(actionId);
    renderGame();
    return;
  }
  if (actionId === "ui:map") {
    openWorldMap();
    return;
  }
  if (actionId === "dialogue:exit") {
    closeNpcDialogue();
    renderGame();
    return;
  }
  if (actionId.startsWith("dialogue:topic:")) {
    const rest = actionId.slice("dialogue:topic:".length);
    const colon = rest.indexOf(":");
    if (colon === -1) {
      return;
    }
    const npcId = rest.slice(0, colon);
    const topicId = rest.slice(colon + 1);
    handleDialogueTopic(npcId, topicId);
    renderGame();
    return;
  }
  if (actionId.startsWith("party:recruit:")) {
    const cid = actionId.replace("party:recruit:", "");
    recruitCompanion(cid);
    renderGame();
    return;
  }
  if (actionId.startsWith("travel:")) {
    travelTo(actionId.replace("travel:", ""));
    renderGame();
    return;
  }
  if (actionId.startsWith("talk:")) {
    openNpcDialogue(actionId.replace("talk:", ""));
    renderGame();
    return;
  }
  if (actionId.startsWith("encounter:")) {
    beginEncounter(actionId.replace("encounter:", ""));
    renderGame();
    return;
  }
  if (actionId === "boss:start") {
    beginBossFight();
    renderGame();
    return;
  }
  if (actionId === "quest:status") {
    gameMessage(getMainQuestStageText(), "system", true);
    if (state.quests.active.includes("smuggler_chain")) {
      gameMessage(getSmugglerQuestText(), "system", true);
    }
    renderGame();
    return;
  }
  if (actionId === "wait:day") {
    state.world.day += 1;
    gameMessage("You spend several cautious hours scouting the district.", "system", true);
    renderGame();
  }
}
function handleShopAction(actionId) {
  if (actionId === "shop:exit") {
    state.ui.mode = "default";
    gameMessage("You leave the market stalls.", "system", true);
    return;
  }
  const itemId = actionId.replace("shop:buy:", "");
  const stock = SHOP_STOCK.find((entry) => entry.itemId === itemId);

    return;

  if (state.player.gold < stock.cost) {
    gameMessage("Not enough gold.", "failure", true);
    return;
  }
  state.player.gold -= stock.cost;
  addItem(state, itemId, 1);

function handleCraftAction(actionId) {
  if (actionId === "craft:exit") {
    state.ui.mode = "default";
    gameMessage("You step away from the crafting bench.", "system", true);
    return;
  }
  const recipeId = actionId.replace("craft:make:", "");
  const recipe = RECIPES.find((entry) => entry.id === recipeId);

    return;

    state.world.flags.forgedWardedKey = true;

    return `Recover remaining sigils: ${missing.join(", ")}.`;
  }
  if (!state.world.flags.forgedWardedKey) {
    return "Craft the Warded Key in the Crafting Hall.";
  }
  if (!state.world.flags.defeatedVexira) {
    return "Travel to Mount Hotenow and defeat Vexira.";
  }
  return "Return to Protector's Enclave and report success.";
}
function getSmugglerQuestText() {
  if (!state.world.flags.smugglerBriefed) {
    return "Speak with Tormund in Blacklake.";
  }
  if (!state.world.flags.smugglerCleared) {
    return "Defeat the smuggler cell at Sunken Pier.";
  }
  return "Collect your reward from Whisper or Kael.";
}
function gameMessage(text, type, includeInLog) {
  appendNarrative(text, type);
  if (includeInLog && state) {
    state.log.push(`[Day ${state.world.day}] ${text}`);
    if (state.log.length > 300) {
      state.log = state.log.slice(-300);
    }
  }
}
function applyRaceBonuses(baseAbilities, bonuses) {
  const result = { ...baseAbilities };
  Object.keys(bonuses).forEach((key) => {
    result[key] += bonuses[key];
  });
  return result;
}
function toLookup(list) {
  return list.reduce((acc, item) => {
    acc[item.id] = item;
    return acc;
  }, {});
}

em;color:var(--text-dim);font-style:italic;line-height:1.4;margin-top:6px}\r\n.combat-actions-bar{background:linear-gradient(180deg,var(--bg-panel),var(--bg-dark));border-top:2px solid var(--border);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex-shrink:0}\r\n.combat-target-select{font-family:var(--font-body);padding:6px 10px;background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:.9em}\r\n.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center}\r\n.modal-overlay.show{display:flex}\r\n.modal{background:linear-gradient(135deg,var(--bg-panel),var(--parchment));border:1px solid var(--gold-dim);border-radius:var(--radius);padding:25px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow)}\r\n.modal h2{font-family:var(--font-title);color:var(--gold);margin-bottom:12px;font-size:1.2em}\r\n.modal p{color:var(--text);margin-bottom:15px;line-height:1.6}\r\n.rest-options{display:flex;gap:10px;flex-wrap:wrap}\r\n.spell-entry{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:6px}\r\n.spell-entry .spell-name{font-family:var(--font-title);color:var(--purple);font-size:.92em;margin-bottom:2px}\r\n.spell-entry .spell-school{font-size:.72em;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}\r\n.spell-entry .spell-desc{font-size:.82em;color:var(--text-dim);line-height:1.4;margin-bottom:4px}\r\n.spell-entry .spell-meta{font-size:.75em;color:var(--gold-dim);font-style:italic}\r\n.dialogue-box{background:linear-gradient(135deg,var(--bg-card),var(--parchment));border:1px solid var(--border-gold);border-radius:var(--radius);padding:16px;margin:10px 0}\r\n.dialogue-speaker-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}\r\n.npc-portrait{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold-dim);background:var(--bg-dark);display:flex;align-items:center;justify-content:center;font-size:1.8em;flex-shrink:0}\r\n.dialogue-speaker-name{font-family:var(--font-title);color:var(--gold);font-size:.95em;margin-bottom:2px}\r\n.dialogue-speaker-info{font-size:.75em;color:var(--text-dim);font-style:italic}\r\n.dialogue-speech{color:var(--text);line-height:1.7;padding:10px 0;font-size:1em}\r\n.dialogue-choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}\r\n.dialogue-choice{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;cursor:pointer;transition:all .2s;text-align:left;color:var(--text);font-family:var(--font-body);font-size:.95em;width:100%}\r\n.dialogue-choice:hover{border-color:var(--gold);background:var(--bg-hover);color:var(--gold-bright);transform:translateX(3px)}\r\n.dialogue-choice .skill-tag{font-size:.72em;color:var(--purple);text-transform:uppercase;font-family:var(--font-title);margin-right:5px;letter-spacing:.5px;padding:1px 5px;background:var(--purple-dim);border-radius:3px}\r\n.morality-bar{height:8px;background:linear-gradient(90deg,#8b0000,#666,#1a5c2a);border-radius:4px;position:relative;margin:6px 0;border:1px solid var(--border)}\r\n.morality-marker{position:absolute;top:-5px;width:16px;height:16px;background:var(--gold);border-radius:50%;border:2px solid var(--text-bright);transform:translateX(-50%);transition:left .5s;box-shadow:0 0 8px rgba(212,168,67,.5)}\r\n.death-saves-display{display:flex;gap:20px;justify-content:center;margin:8px 0}\r\n.ds-group{display:flex;align-items:center;gap:4px;font-size:.8em}\r\n.ds-pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);display:inline-block}\r\n.ds-pip.success{background:var(--green);border-color:var(--green)}\r\n.ds-pip.failure{background:var(--red);border-color:var(--red)}\r\n.sound-controls{position:fixed;bottom:15px;right:15px;z-index:100;display:flex;flex-direction:column;gap:4px}\r\n.sound-btn{background:var(--bg-panel);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.78em;cursor:pointer;color:var(--text-dim);transition:all .2s;font-family:var(--font-body)}\r\n.sound-btn:hover{border-color:var(--gold);color:var(--gold)}\r\n.sound-btn.active{background:var(--gold-dim);color:var(--text-bright);border-color:var(--gold)}\r\n.shop-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}\r\n.shop-item .item-info .name{color:var(--text-bright);font-weight:600;font-size:.95em}\r\n.shop-item .item-info .desc{color:var(--text-dim);font-size:.82em;margin-top:2px}\r\n.shop-item .cost{font-family:var(--font-title);color:var(--gold);font-size:.9em;white-space:nowrap;margin-left:10px}\r\n.faction-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72em;font-family:var(--font-title);text-transform:uppercase;letter-spacing:.5px}\r\n.faction-badge.harpers{background:#1a2a3a;color:#6ab4ff;border:1px solid #2a4a6a}\r\n.faction-badge.zhentarim{background:#2a1a1a;color:#ff9a6a;border:1px solid #5a2a2a}\r\n.faction-badge.lords{background:#2a2a1a;color:#ffe06a;border:1px solid #5a5a2a}\r\n.faction-badge.enclave{background:#1a2a1a;color:#6aff9a;border:1px solid #2a5a2a}\r\n.faction-badge.gauntlet{background:#2a1a2a;color:#ff6adf;border:1px solid #5a2a5a}\r\n@media(max-width:768px){\r\n  .game-sidebar{position:fixed;right:-320px;top:0;bottom:0;z-index:400;transition:right .3s;box-shadow:var(--shadow)}\r\n  .game-sidebar.open{right:0}\r\n  .title-main{font-size:2.2em}\r\n  .cc-abilities{grid-template-columns:repeat(2,1fr)}\r\n  .cc-grid{grid-template-columns:repeat(2,1fr)}\r\n  .combat-log-panel{display:none}\r\n}\r\n\u003c/style>\r\n\u003c/head>\r\n\u003cbody>\r\n\u003cdiv id=\"app\">\r\n\r\n\u003c!-- ==================== TITLE SCREEN ==================== -->\r\n\u003cdiv id=\"title-screen\">\r\n  \u003cdiv class=\"title-main\">Chronicles of the Sword Coast\u003c/div>\r\n  \u003cdiv class=\"title-sub\">A D&amp;D 5th Edition Adventure\u003c/div>\r\n  \u003cdiv class=\"title-divider\">\u003c/div>\r\n  \u003cdiv class=\"title-buttons\">\r\n    \u003cbutton class=\"btn btn-primary btn-lg\" onclick=\"startNewGame()\">⚔️ New Adventure\u003c/button>\r\n    \u003cbutton class=\"btn btn-lg\" onclick=\"loadGame()\" id=\"load-btn\" style=\"display:none\">📖 Continue Journey\u003c/button>\r\n  \u003c/div>\r\n  \u003cdiv class=\"title-flavor\">\"Not all who wander are lost — but in Neverwinter, it helps to keep your sword close.\"\u003c/div>\r\n\u003c/div>\r\n\r\n\u003c!-- ==================== CHARACTER CREATION ==================== -->\r\n\u003cdiv id=\"char-creation\">\u003c/div>\r\n\r\n\u003c!-- ==================== GAME SCREEN ==================== -->\r\n\u003cdiv id=\"game-screen\">\r\n  \u003cdiv class=\"game-header\">\r\n    \u003cdiv class=\"location-display\" id=\"location-name\">Protector's Enclave, Neverwinter\u003c/div>\r\n    \u003cdiv class=\"char-brief\" id=\"char-brief\">\u003c/div>\r\n    \u003cdiv class=\"header-btns\">\r\n      \u003cbutton class=\"btn btn-sm\" onclick=\"toggleSidebar()\">☰ Sheet\u003c/button>\r\n      \u003cbutton class=\"btn btn-sm\" onclick=\"showRestDialog()\">🏕️ Rest\u003c/button>\r\n      \u003cbutton class=\"btn btn-sm\" onclick=\"saveGame()\">💾 Save\u003c/button>\r\n    \u003c/div>\r\n  \u003c/div>\r\n  \u003cdiv class=\"game-body\">\r\n    \u003cdiv class=\"game-main\">\r\n      \u003cdiv class=\"narrative-panel\" id=\"narrative-panel\">\r\n        \u003cdiv class=\"narrative-text\" id=\"narrative\">\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"action-panel\">\r\n        \u003cdiv class=\"actions\" id=\"actions\">\u003c/div>\r\n      \u003c/div>\r\n    \u003c/div>\r\n    \u003cdiv class=\"game-sidebar\" id=\"sidebar\">\r\n      \u003cdiv class=\"sidebar-tabs\">\r\n        \u003cdiv class=\"sidebar-tab active\" onclick=\"switchSidebarTab('character')\">Character\u003c/div>\r\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('inventory')\">Inventory\u003c/div>\r\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('quests')\">Quests\u003c/div>\r\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('spells')\">Spells\u003c/div>\r\n        \u003cdiv class=\"sidebar-tab\" onclick=\"switchSidebarTab('log')\">Log\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"sidebar-content\">\r\n        \u003cdiv class=\"sidebar-panel active\" id=\"panel-character\">\u003c/div>\r\n        \u003cdiv class","PLAN.md":"﻿# PLAN\n\n## Current status (2026-04-12)\n- Only source file found: `DNDGAME.txt`.\n- File contains narrative text + an opening ```html fence + partial HTML/CSS.\n- Snapshot is truncated mid-tag and does not include any JavaScript logic.\n\n## Checkpoint progress\n- Phase 1 complete: recovered assets, modular file structure created, legacy snapshot preserved.\n- Phase 2 complete: runnable baseline runtime implemented (state, save/load, exploration, dialogue, combat, crafting, boss path).\n\n## Goals\n1. Recover a runnable baseline from the available snapshot.\n2. Refactor into modular browser project files.\n3. Rebuild/complete missing systems and content in a data-driven way.\n4. Stabilize save/load, combat, quests, and UX for end-to-end playability.\n\n## Phases\n\n### Phase 1: Recovery + Structure\n- Extract recoverable CSS and HTML shell into project files.\n- Preserve a legacy snapshot for reference.\n- Create modular folders (`src/core`, `src/data`, `src/ui`, `styles`).\n- Produce `BUGS.md` with known blockers from the truncated source.\n\n### Phase 2: Core Runtime (safe baseline)\n- Implement a minimal game engine with explicit state object.\n- Implement robust save/load with versioned schema.\n- Implement title screen -> character creation -> game loop transitions.\n- Implement sidebar rendering and action routing with guardrails.\n\n### Phase 3: Content Completion\n- Add remaining NPCs (Whisper, Neverember, Vexira, Tormund, Miri) and existing core NPC set.\n- Add location encounters and complete quest progression path.\n- Add crafting recipes/materials and integration with quest progression.\n- Add final boss and ending states.\n\n### Phase 4: Hardening + UX\n- Dead-end prevention and fail/recovery path.\n- Synchronize quest flags, inventory deltas, combat/rest/spell state.\n- Improve prompts, feedback, and help panel.\n- Mobile-safe layout checks and keyboard-friendly controls where practical.\n\n### Phase 5: Verification + Documentation\n- Smoke test start-to-finish flow.\n- Document structure, save format, and content authoring in `README.md`.\n- Record known limitations and future enhancements.\n\n## Immediate checkpoint target\n- Complete Phase 1 and Phase 2 with a runnable modular baseline.\r\n","README.md":"﻿# Chronicles of the Sword Coast\n\nA modular browser RPG rebuilt from a truncated legacy snapshot.  \n**Repository:** [github.com/joshuaparris/SwordChronicles](https://github.com/joshuaparris/SwordChronicles)\n\n## Run locally\n1. Open a terminal in this folder.\n2. Start a local server:\n   - `python -m http.server 8765`\n3. Open `http://127.0.0.1:8765/index.html` in a browser.\n\n## Deploy (public web link)\n\nThe game is **static files at the repo root** (`index.html`, `src/`, `styles/`, `assets/`). There is no build step.\n\n### Vercel (typical)\n\n1. Sign in at [vercel.com](https://vercel.com) and choose **Add New… → Project**.\n2. **Import** [github.com/joshuaparris/SwordChronicles](https://github.com/joshuaparris/SwordChronicles) (or your fork). Use the repo that contains this full tree, not an empty README-only repo.\n3. Settings: **Framework Preset** → **Other**. Leave **Root Directory**, **Build Command**, and **Output Directory** all **empty**.\n4. Deploy. Your play link will look like `https://\u003cproject-name>.vercel.app/` (Vercel may also assign a `*.vercel.app` preview URL).\n\nIf you see **404 NOT_FOUND**, the connected project is still not this codebase—open the deployment **Source** tab and confirm `index.html` is listed at the top level.\n\n### Netlify\n\n**Add new site → Import an existing project** from the same GitHub repo. Set **publish directory** to `.` (or leave default if Netlify detects a static root). Deploy; you get a `*.netlify.app` URL.\n\n### GitHub Pages (optional)\n\nEnable **Pages** in the repo **Settings → Pages**, source **Deploy from branch** `main` and folder **`/` (root)** if available, or use a static workflow. Paths in this project are relative (`./styles/…`), so a project Pages URL like `https://\u003cuser>.github.io/SwordChronicles/` works once `index.html` is served from that path.\n\n## Project structure\n- `index.html`: app shell and UI containers.\n- `styles/main.css`: core styling (recovered + patch updates).\n- `src/main.js`: gameplay loop, UI actions, dialogue, encounters, crafting, boss flow.\n- `src/core/*`: dice, save/load, state helpers.\n- `src/data/*`: races, classes, spells, items, recipes, NPCs, locations, quests.\n- `src/ui/render.js`: screen rendering and sidebar/action panel rendering.\n- `legacy/DNDGAME_snapshot_truncated.html`: preserved legacy extraction.\n- `PLAN.md`: phased roadmap.\n- `BUGS.md`: source integrity issues from the legacy snapshot.\n\n## Save data\n- Save key: `chronicles_sword_coast_save`\n- Schema version: `1`\n- Save payload includes `version`, `savedAt`, and serialized `state`.\n\n## Content authoring\nAdd or edit content in `src/data/*`:\n- New NPCs: `src/data/npcs.js`\n- New locations/encounters/boss tuning: `src/data/locations.js`\n- New quests: `src/data/quests.js`\n- New items/shop entries: `src/data/items.js`\n- New crafting recipes: `src/data/recipes.js`\n- New spells/classes/races: corresponding data files\n\n## Current gameplay coverage\n- Title screen, new game, load game, help prompt\n- Character creation\n- Exploration and travel\n- NPC interactions\n- Turn-based combat with attacks, spells, potion, flee\n- Side quest and main quest progression\n- Crafting Warded Key\n- Final boss fight and victory ending state\n- Death/recovery path\n\n## Known limitations\n- No automated browser test harness yet.\n- Encounter and dialogue depth is intentionally compact for this checkpoint.\n- Balance tuning is baseline only and may need iteration.\n","assets/portraits/mira.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 80 80\" width=\"80\" height=\"80\">\n  \u003ccircle cx=\"40\" cy=\"40\" r=\"38\" fill=\"#2a2520\" stroke=\"#d4a843\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"40\" cy=\"32\" rx=\"18\" ry=\"22\" fill=\"#c4a88a\"/>\n  \u003cpath d=\"M22 50 Q40 45 58 50 L58 72 L22 72 Z\" fill=\"#3a4a5a\"/>\n  \u003crect x=\"28\" y=\"68\" width=\"24\" height=\"8\" fill=\"#5a4030\"/>\n\u003c/svg>\n","assets/portraits/orin.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 80 80\" width=\"80\" height=\"80\">\n  \u003ccircle cx=\"40\" cy=\"40\" r=\"38\" fill=\"#1a1828\" stroke=\"#e8e0d0\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"40\" cy=\"32\" rx=\"17\" ry=\"21\" fill=\"#d8c8b0\"/>\n  \u003crect x=\"24\" y=\"48\" width=\"32\" height=\"28\" fill=\"#f0f0f0\" stroke=\"#c0c0c0\"/>\n  \u003ccircle cx=\"40\" cy=\"12\" r=\"4\" fill=\"#f0e8d0\"/>\n\u003c/svg>\n","assets/portraits/tassa.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 80 80\" width=\"80\" height=\"80\">\n  \u003ccircle cx=\"40\" cy=\"40\" r=\"38\" fill=\"#0d1825\" stroke=\"#3a7bd5\" stroke-width=\"2\"/>\n  \u003cellipse cx=\"40\" cy=\"32\" rx=\"16\" ry=\"20\" fill=\"#a08068\"/>\n  \u003cpath d=\"M20 52 L40 42 L60 52 L58 72 L22 72 Z\" fill=\"#1a3050\"/>\n  \u003cpath d=\"M32 18 L48 18 L46 26 L34 26 Z\" fill=\"#2a4058\"/>\n\u003c/svg>\n","assets/scenes/blacklake.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 200\" width=\"640\" height=\ " y1=\"1\" x2=\"0\" y2=\"0\">\u003cstop offset=\"0\" stop-color=\"#1a0805\"/>\u003cstop offset=\".6\" stop-color=\"#4a1510\"/>\u003cstop offset=\"1\" stop-color=\"#2a0805\"/>\u003c/linearGradient>\u003c/defs>\n  \u003crect width=\"640\" height=\"200\" fill=\"url(#lava)\"/>\n  \u003cpath d=\"M0 160 L100 120 L200 140 L320 90 L440 130 L540 100 L640 140 L640 200 L0 200 Z\" fill=\"#2a1010\" stroke=\"#c0392b55\"/>\n  \u003cellipse cx=\"320\" cy=\"175\" rx=\"200\" ry=\"30\" fill=\"#ff440033\"/>\n  \u003cpath d=\"M280 200 L300 80 L340 80 L360 200\" fill=\"#3a1510\" stroke=\"#e74c3c\" stroke-width=\"2\"/>\n  \u003ccircle cx=\"310\" cy=\"100\" r=\"4\" fill=\"#ffaa00\"/>\u003ccircle cx=\"335\" cy=\"95\" r=\"3\" fill=\"#ff6600\"/>\n\u003c/svg>\n","assets/scenes/protector_enclave.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 200\" width=\"640\" height=\"200\">\n  \u003cdefs>\u003clinearGradient id=\"sky\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#1e2a4a\"/>\u003cstop offset=\"1\" stop-color=\"#0d1520\"/>\u003c/linearGradient>\u003clinearGradient id=\"gold\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#d4a843\"/>\u003cstop offset=\"1\" stop-color=\"#5a4a1a\"/>\u003c/linearGradient>\u003c/defs>\n  \u003crect width=\"640\" height=\"200\" fill=\"url(#sky)\"/>\n  \u003cpath d=\"M0 140 L80 100 L160 120 L240 90 L320 110 L400 85 L480 105 L560 95 L640 115 L640 200 L0 200 Z\" fill=\"#121820\" opacity=\".9\"/>\n  \u003crect x=\"260\" y=\"55\" width=\"120\" height=\"90\" fill=\"#1a2030\" stroke=\"url(#gold)\" stroke-width=\"3\"/>\n  \u003cpolygon points=\"250,55 320,15 390,55\" fill=\"#2a3548\" stroke=\"#d4a843\" stroke-width=\"2\"/>\n  \u003crect x=\"295\" y=\"95\" width=\"50\" height=\"50\" fill=\"#0a0a12\" stroke=\"#5a4a2a\"/>\n  \u003cline x1=\"0\" y1=\"140\" x2=\"640\" y2=\"140\" stroke=\"#d4a84333\" stroke-width=\"2\"/>\n\u003c/svg>\n","assets/scenes/sunken_pier.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 200\" width=\"640\" height=\"200\">\n  \u003crect width=\"640\" height=\"200\" fill=\"#050810\"/>\n  \u003cpath d=\"M0 100 L640 110 L640 200 L0 200 Z\" fill=\"#0a1522\"/>\n  \u003cpath d=\"M80 100 L100 60 L120 100 M200 105 L220 55 L240 105 M400 108 L420 58 L440 108\" stroke=\"#2a4058\" stroke-width=\"6\"/>\n  \u003cline x1=\"0\" y1=\"95\" x2=\"640\" y2=\"102\" stroke=\"#1a305080\" stroke-width=\"20\"/>\n  \u003ccircle cx=\"520\" cy=\"50\" r=\"15\" fill=\"#4a6a8a22\" stroke=\"#3a5a7a44\"/>\n\u003c/svg>\n","package.json":"{\n  \"name\": \"sword-chronicles\",\n  \"version\": \"0.1.0\",\n  \"private\": true,\n  \"description\": \"Browser-based D&D-style RPG\",\n  \"type\": \"module\",\n  \"scripts\": {\n    \"test\": \"node test_chronicles.mjs\"\n  },\n  \"devDependencies\": {\n    \"jsdom\": \"^29.1.1\"\n  }\n}\n","src/data/atmosphere.js":"/** Rich Dungeon Master-style scene narration (shown when you arrive). */\nexport const LOCATION_DM = {\n  protector_enclave: [\n    \"Banners snap in a wind that tastes of distant smoke. Sergeants bark orders across the cobbles while couriers weave between columns of weary militia.\",\n    \"High above, griffon silhouettes wheel against bruised clouds—Neverwinter still pretends it commands the sky as well as the streets.\",\n    \"The Enclave smells of oiled leather, ink, and ration bread; every face here is measuring how long the city walls will hold.\"\n  ],\n  market_square: [\n    \"The square is a riot of color and noise: copper scales clang, spice smoke stings your eyes, and a bard's lute competes with a preacher's warnings about ash omens.\",\n    \"Wagons groan under salvage from the frontier—crates stamped with guild marks, bolts of cloth, jars of herbs that glitter like crushed stars.\",\n    \"Children dart underfoot chasing a runaway chicken; a one-eyed merchant watches you with the calm of someone who prices trouble by the hour.\"\n  ],\n  hall_of_justice: [\n    \"Marble soaks up sound until even whispers feel judged. Sunlight through tall windows paints the floor in pale gold and crimson sigils of Torm.\",\n    \"Clerks scratch verdicts in ledgers; paladins murmur oaths. Somewhere deeper, a choir practices a hymn that stumbles on the high notes—nerves, not lack of faith.\",\n    \"The air is cool, faintly metallic, as if the building itself remembers every blade surrendered at the door.\"\n  ],\n  dockward: [\n    \"Rope and tar define the perfume of Dockward. Gulls scream; a bell tolls from a listing tower; somewhere a drum keeps time for stevedores hauling ash-stained crates.\",\n    \"Lanterns sway on chains, painting the planks in sickly amber. Eyes track you from doorways—some curious, some calculating the weight of your purse.\",\n    \"Water slaps pilings below like slow applause. You taste salt, rust, and the faint sweet rot of something dragged up from too deep.\"\n  ],\n  blacklake: [\n    \"Once-grand estates lean toward one another as if sharing secrets. Shutters hang crooked; ivy strangles crests you half recognize from old ballads.\",\n    \"Fog pools in courtyards where fountains ran dry decades ago. Your footfalls echo too loud—every shadow feels like an invitation or a warning.\",\n    \"A dog barks once, very far away, and is silent. The district holds its breath.\"\n  ],\n  crafting_hall: [\n    \"Heat rolls from the forge in slow waves. Runes chalked on the floor shimmer where stray sparks kiss them; tongs and hammers hang like sleeping beasts.\",\n    \"Charcoal grit crunches underfoot. A half-finished breastplate gleams on a stand, waiting for an owner who may never come.\",\n    \"Someone has pinned dried herbs along the rafters—wards against curses, or against bad temper; with smiths, it is often the same.\"\n  ],\n  graveyard_road: [\n    \"The road to Neverdeath climbs through mist that clings to your cloak like guilty thoughts. Iron fences twist with rust; statues weep streaks of black rain.\",\n    \"Crows argue on leaning headstones. Every dozen paces you pass a small shrine—coins, wilted flowers, a child's toy left for luck.\",\n    \"The fog carries a chill that has nothing to do with weather. Footprints ahead of you end abruptly, as if their maker simply ceased.\"\n  ],\n  sunken_pier: [\n    \"Timbers groan under your weight, sodden and dark as wet bone. Below, black water slaps in slow rhythm—something large turns once, then stills.\",\n    \"Broken crates spill nails and stained sacking; a rope ladder dangles into nothing. Torchlight would help, but fire here feels like an accusation.\",\n    \"The tide's breath crawls up through the cracks, cold and patient. Every shadow between the pilings could hide a watcher—or a knife.\"\n  ],\n  mount_hotenow: [\n    \"Ash drifts like gray snow. The ground shudders faintly, a heartbeat miles below stone; fissures glow dull ember-red, breathing heat against your face.\",\n    \"Storm clouds coil overhead, lit from beneath by the mountain's wound. The air tastes of cinders and ozone, of rituals spoken too loud for the world to ignore.\",\n    \"Here, the Sword Coast feels small—just you, the wind, and the sense that something vast has already decided to wake up.\"\n  ]\n};\n\nexport const ENCOUNTER_DM = {\n  sunken_pier: [\n    \"The Dungeon Master sets the scene: lanterns sway as figures in salt-stiff cloaks surge from behind splintered crates. Coins and sigils glint at their belts—these couriers mean to reach the boats alive.\",\n    \"You hear oars knocking against hulls, urgent whispers in a cant you almost understand. The pier itself seems to lean toward the water, eager to be rid of you.\"\n  ],\n  graveyard_road: [\n    \"Fog thickens until the wight's eyes are the clearest things in the world—cold, patient, hungry. Grave soil clings to its armor like wet velvet.\",\n    \"The Dungeon Master describes a silence so complete that your own heartbeat feels rude. Then steel scrapes stone, and the sentinel comes.\"\n  ],\n  mount_hotenow: [\n    \"Ash swirls into the shape of blades before the vanguard steps through. Their armor weeps heat; each footfall leaves a scorch you can smell.\",\n    \"The Dungeon Master warns you: this is not a brawl—it's a trial by fire under a sky the color of old blood.\"\n  ]\n};\n\nexport const BOSS_DM_INTRO = [\n  \"The rift tears wider. Vexira rides the ash like a queen on a tide of cinders; her voice is calm, almost kind, as she promises you a place in the flame's memory.\",\n  \"The Dungeon Master paints the battlefield: ember motes hang frozen in the air, each one a second that might be your last. Vexira smiles—and the world burns toward her hand.\"\n];\n","src/data/classes.js":"﻿export const CLASSES = [\n  {\n    id: \"fighter\",\n    name: \"Fighter\",\n    description: \"Weapons specialist built for sustained frontline combat.\",\n    hitDie: 10,\n    armorClassBase: 16,\n    weaponDamage: \"1d8+3\",\n    primaryAbility: \"str\",\n    spellcaster: false,\n    startingSpells: []\n  },\n  {\n    id: \"rogue\",\n    name: \"Rogue\",\n    description: \"Precise striker that relies on agility and timing.\",\n    hitDie: 8,\n    armorClassBase: 15,\n    weaponDamage: \"1d6+4\",\n    primaryAbility: \"dex\",\n    spellcaster: false,\n    startingSpells: []\n  },\n  {\n    id: \"cleric\",\n    name: \"Cleric\",\n    description: \"Holy battlemage with healing and radiant power.\",\n    hitDie: 8,\n    armorClassBase: 15,\n    weaponDamage: \"1d6+2\",\n    primaryAbility: \"wis\",\n    spellcaster: true,\n    maxSpellSlots: 2,\n    startingSpells: [\"sacred_flame\", \"healing_word\", \"guiding_bolt\"]\n  },\n  {\n    id: \"wizard\",\n    name: \"Wizard\",\n    description: \"Arcane scholar with strong utility and burst damage.\",\n    hitDie: 6,\n    armorClassBase: 13,\n    weaponDamage: \"1d4+1\",\n    primaryAbility: \"int\",\n    spellcaster: true,\n    maxSpellSlots: 3,\n    startingSpells: [\"fire_bolt\", \"magic_missile\", \"shield\"]\n  },\n  {\n    id: \"ranger\",\n    name: \"Ranger\",\n    description: \"Hunter and scout skilled in ranged pressure.\",\n    hitDie: 10,\n    armorClassBase: 15,\n    weaponDamage: \"1d8+2\",\n    primaryAbility: \"dex\",\n    spellcaster: true,\n    maxSpellSlots: 2,\n    startingSpells: [\"hunters_mark\", \"cure_wounds\"]\n  },\n  {\n    id: \"warlock\",\n    name: \"Warlock\",\n    description: \"Pact-bound caster with reliable eldritch offense.\",\n    hitDie: 8,\n    armorClassBase: 14,\n    weaponDamage: \"1d6+2\",\n    primaryAbility: \"cha\",\n    spellcaster: true,\n    maxSpellSlots: 2,\n    startingSpells: [\"eldritch_blast\", \"hex\", \"armor_of_agathys\"]\n  }\n];\n\nexport const BACKGROUNDS = [\n  { id: \"soldier\", name: \"Soldier\", description: \"Veteran of border skirmishes and siege lines.\" },\n  { id: \"acolyte\", name: \"Acolyte\", description: \"Temple-trained pilgrim of lore and ritual.\" },\n  { id: \"criminal\", name: \"Criminal\", description: \"Streetwise operator with undercity contacts.\" },\n  { id: \"sage\", name: \"Sage\", description: \"Researcher devoted to forgotten records.\" },\n  { id: \"outlander\", name: \"Outlander\", description: \"Wilderness survivor from frontier lands.\" },\n  { id: \"noble\", name: \"Noble\", description: \"Court-bred voice with political leverage.\" }\n];\r\n","src/data/companions.js":"/** Max allies traveling with the hero (not counting the player). */\nexport const MAX_PARTY_COMPANIONS = 2;\n\nexport const COMPANIONS = [\n  {\n    id: \"mira\",\n    name: \"Mira Stoneheel\",\n    role: \"Mercenary fighter\",\n    portrait: \"./assets/portraits/mira.svg\",\n    recruitLocationId: \"market_square\",\n    recruitLabel: \"Recruit Mira Stoneheel (mercenary, 25 gp)\",\n    recruitCostGold: 25,\n    needsFlags: { acceptedMainQuest: true },\n    needsDiscovered: [],\n    introDm: [\n      \"Mira claps your shoulder, shield already slung. \\\"Contract's simple: I hit what you point at, and we split the interesting loot.\\\"\"\n ses: [\n      \"Orin murmurs a quiet prayer whenever you pass a beggar or a guard.\",\n      \"\\\"The Hall feels distant already,\\\" he says. \\\"Good. Comfort makes feet slow.\\\"\",\n      \"Incense clings to his robes; he points out sigils scratched above doorways you would have missed.\"\n    ],\n    downedPhrase: \"Brother Orin collapses, shielding his symbols—he will not rise in this fight until tended.\",\n    struckPhrase: \"Orin gasps; red soaks his sleeve, but his jaw stays set.\"\n  },\n  {\n    id: \"tassa\",\n    name: \"Tassa Saltjaw\",\n    role: \"Dockwise guide\",\n    portrait: \"./assets/portraits/tassa.svg\",\n    recruitLocationId: \"dockward\",\n    recruitLabel: \"Hire Tassa Saltjaw as your guide\",\n    recruitCostGold: 15,\n    needsFlags: {},\n    needsDiscovered: [],\n    introDm: [\n      \"Tassa grins, fileting an apple with a knife too sharp for fruit. \\\"Docks, graves, ash-holes—I know the shortcuts and the people who pretend they don't exist. Lead on.\\\"\"\n    ],\n    maxHp: 18,\n    ac: 14,\n    attackBonus: 5,\n    damage: \"1d6+3\",\n    attackPhrases: [\"Tassa darts in, knife a silver blur.\", \"The guide slips behind cover and strikes from the shadows.\", \"Salt-crusted boots kick grit into the enemy's eyes—then the blade.\"],\n    hitPhrases: [\"A precise cut opens a new line of pain.\", \"Tassa's knife finds a gap you didn't see.\"],\n    missPhrases: [\"Tassa rolls clear, cursing the tide's bad luck.\", \"The blade sparks off buckle and bone—no blood this time.\"],\n    travelPhrases: [\n      \"Tassa trades nods with dockhands; whispers follow in your wake like gulls.\",\n      \"\\\"Smell that? Low tide and lies,\\\" she says cheerfully.\",\n      \"She marks chalk symbols on posts—warnings, or advertisements, you can't tell.\"\n    ],\n    downedPhrase: \"Tassa crumples, clutching her side—down until you make camp or rest.\",\n    struckPhrase: \"Tassa hisses through her teeth, dance of the knife faltering for a moment ice a harmless bluff\",\n    kind: \"skill\",\n    skill: \"Deception\",\n    ability: \"cha\",\n    dc: 13,\n    pass: [\n      \"You spin a trivial lie to the air; your face keeps pace. Dangerous skill, useful muscle.\",\n      \"Even shadows seem half-convinced. Good rehearsal.\"\n    ],\n    fail: [\n      \"You stumble over a simple fib—you need coffee or courage.\",\n      \"Your tell shows; thankfully no one was buying anyway.\"\n    ]\n  },\n  {\n    id: \"persuasion\",\n    label: \"Persuasion — warm up your voice\",\n    kind: \"skill\",\n    skill: \"Persuasion\",\n    ability: \"cha\",\n    dc: 12,\n    pass: [\n      \"Words come smooth—promise, humor, weight. You're tuned for the next real conversation.\",\n      \"You could talk a guard into directions, maybe not into treason. Enough.\"\n    ],\n    fail: [\n      \"You sound rehearsed, even to yourself.\",\n      \"Charisma needs an audience; stone and fog don't clap.\"\n    ]\n  },\n  {\n    id: \"intimidation\",\n    label: \"Intimidation — hard stare, quiet menace\",\n    kind: \"skill\",\n    skill: \"Intimidation\",\n    ability: \"cha\",\n    dc: 13,\n    pass: [\n      \"You let silence do the shouting. A passerby finds somewhere else to be.\",\n      \"Your shadow grows an inch; good trick. Use it wisely.\"\n    ],\n    fail: [\n      \"You look constipated, not fearsome.\",\n      \"The city has seen worse than your glower.\"\n    ]\n  },\n  {\n    id: \"performance\",\n    label: \"Performance — hum, whistle, or posture\",\n    kind: \"skill\",\n    skill: \"Performance\",\n    ability: \"cha\",\n    dc: 12,\n    pass: [\n      \"A few notes hang right; a passerby almost claps, then remembers they're in a hurry.\",\n      \"You find the rhythm of the street and borrow it—briefly, you're part of the song.\"\n    ],\n    fail: [\n      \"You break pitch; crows object.\",\n      \"The muse is on break. Permanently.\"\n    ]\n  },\n  {\n    id: \"athletics\",\n    label: \"Athletics — stretch, reathe in: smoke, stone, cooking oil, and the stubborn pride of a city that refuses to kneel.\",\n      \"The air is urban—layered, tired, alive.\"\n    ],\n    locations: {\n      dockward: {\n        lines: [\n          \"Salt hits first, then tar, then something sweet-rotten from the hold of a lazy freighter.\",\n          \"Low tide honesty: brine, mud, and old rope. You've smelled worse promises.\",\n          \"Spray mists your face; gulls argue like dockside politicians.\"\n        ]\n      },\n      sunken_pier: {\n        lines: [\n          \"Cold brine and deeper rot—water that has tasted too many secrets to stay clean.\",\n          \"Each inhale is half ocean, half fear.\"\n        ]\n      },\n      market_square: {\n        lines: [\n          \"No surf here—only spice, sweat, and iron. The sea is a rumor carried on someone's cloak.\"\n        ]\n      },\n      mount_hotenow: {\n        lines: [\n          \"No ocean—only ash and hot metal pretending to be weather.\",\n          \"You cough; the mountain breathes cinders back at you.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"listen\",\n    label: \"Listen closely\",\n    kind: \"skill\",\n    skill: \"Perception (hearing)\",\n    ability: \"wis\",\n    dc: 13,\n    pass: [\n      \"Distant bells, footsteps on different rhythms, a whispered price, a prayer—layers separate in your ear.\",\n      \"You catch a phrase not meant for you. You'll pretend you didn't.\"\n    ],\n    fail: [\n      \"Noise wins. The city is a single shout wearing many mouths.\",\n      \"Ringing in your ears—yours or the world's?\"\n    ]\n  },\n  {\n    id: \"examine_ground\",\n    label: \"Examine the ground underfoot\",\n    kind: \"skill\",\n    skill: \"Investigation\",\n    ability: \"int\",\n    dc: 12,\n    pass: [\n      \"Ash, mud, blood old or new—you can tell which. Someone dragged something heavy here.\",\n      \"Cobble wear tells you which way traffic flows when no one's watching.\"\n    ],\n    fail: [\n      \"Dirt is dirt. Ground keeps counsel.\",\n      \"You find a coin! …Copper. Of course.\"\n    ]\n  },\n  {\n    id: \"check_clothes\",\n    label: \"Check your clothes & gear\",\n    kind: \"flavor\",\n    lines: [\n      \"Buckles fastened, seams holding, cloak weighted correctly—small rituals before violence or diplomacy.\",\n      \"A loose thread, a smear of ash—you fix what you can; the rest is character.\"\n    ],\n    locations: {\n      mount_hotenow: {\n        lines: [\n          \"Ember flecks dot your hem; leather stiffens from heat. You're dressed for war with a volcano.\"\n        ]\n      },\n      graveyard_road: {\n        lines: [\n          \"Fog-damp wool clings; you smell like iron and someone else's grief.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"sit_down\",\n    label: \"Sit down and breathe\",\n    kind: \"flavor\",\n    lines: [\n      \"You claim a step, a stump, dignity on stone—exhale until your shoulders drop an inch.\",\n      \"The world keeps hurrying. You don't, for three slow breaths.\"\n    ],\n    locations: {\n      hall_of_justice: {\n        lines: [\n          \"Marble leeches cold through your cloak; the hall's gravity makes sitting feel like testimony.\"\n        ]\n      },\n      protector_enclave: {\n        lines: [\n          \"Guards nod once—resting soldiers are still soldiers. You sit like you belong.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"stretch_rest\",\n    label: \"Stretch legs & roll shoulders\",\n    kind: \"flavor\",\n    lines: [\n      \"Joints pop; blood remembers how to reach your fingers.\",\n      \"Travel knots untie themselves—until the next mile.\"\n    ]\n  },\n  {\n    id: \"drink_water\",\n    label: \"Sip from your waterskin\",\n    kind: \"flavor\",\n    lines: [\n      \"Water tastes flat, safe, precious. Cities run on it and never thank it.\",\n      \"You ration the swallow—habit of the road.\"\n    ],\n    locations: {\n      mount_hotenow: {\n        lines: [\n          \"The first swallow is heaven; the aftertaste is ash. You drink anyway.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"eat_rations\",\n    label: \"Nibble travel rations\",\n    kind: \"flavor\",\n    lines: [\n      \"Hard bread, salt fish, something pretending to be cheese—fuel, not feast.\",\n      \"You're not hungry, but your hands want occupation.\"\n    ]\n  },\n  {\n    id: \"whisper_companion\",\n    label: \"Whisper to a companion\",\n    kind: \"flavor\",\n    lines: [\n      \"You're alone in the party sense—still, you mutter a thought to the air. Old habit.\",\n      \"No allies beside you; the street doesn't answer. Silence feels heavier.\"\n    ],\n    withPartyLines: [\n      \"You lean in; a murmured plan, a joke sharp enough to cut tension. Nods answer.\",\n      \"\\\"Eyes left,\\\" you breathe—they adjust without breaking stride. That's trust.\",\n      \"Your companion listens, jaw tight, then exhales. \\\"Copy,\\\" they say.\"\n    ]\n  },\n  {\n    id: \"pray_moment\",\n    label: \"Offer a silent prayer or oath\",\n    kind: \"flavor\",\n    lines: [\n      \"Words you don't share with maps—promise, regret, or thanks. The street doesn't care; you do.\",\n      \"Oath tastes like copper. You swallow it and stand straighter.\"\n    ]\n  },\n  {\n    id: \"hum_tune\",\n    label: \"Hum an old tune\",\n    kind: \"flavor\",\n    lines: [\n      \"Melody half-remembered; it dies under bootheels and wind. Still, it helped.\",\n      \"Music is armor against dread—you wear a bar or two.\"\n    ]\n  },\n  {\n    id: \"watch_sky\",\n    label: \"Watch the sky\",\n    kind: \"flavor\",\n    lines: [\n      \"Clouds drag like tired banners. No omens—unless impatience counts.\",\n      \"A thin scratch of smoke threads upward from somewhere you haven't saved yet.\"\n    ],\n    locations: {\n      mount_hotenow: {\n        lines: [\n          \"The sky is wrong-color—ember-stained, storm-fed. Beauty and warning share the same face.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"feel_pocket_gold\",\n    label: \"Count coin by touch\",\n    kind: \"flavor\",\n    lines: [\n      \"Metal clicks; the weight is real. Comfort and target on your hip.\",\n      \"Enough for a night, a bribe, or a mistake—same coins, different stories.\"\n    ]\n  },\n  {\n    id: \"study_weapon\",\n    label: \"Study your weapon\",\n    kind: \"flavor\",\n    lines: [\n      \"Edge, balance, notches—each tells a fight you've survived. You promise the steel another.\",\n      \"Maintenance is meditation. Wipe, oil, test the grip. Ready.\"\n    ]\n  },\n  {\n    id: \"remember_why\",\n    label: \"Remember why you came\",\n    kind: \"flavor\",\n    lines: [\n      \"Fear and duty arm-wrestle; duty cheats with better arguments.\",\n      \"Names surface—people who will live or die because you stayed or left.\",\n      \"You chose this road. The road hasn't finished choosing you.\"\n    ]\n  },\n  {\n    id: \"luck_touch\",\n    label: \"Touch a lucky charm or superstition\",\n    kind: \"flavor\",\n    lines: [\n      \"Ritual doesn't need truth—only rhythm. You tap wood, trace a seam, breathe once.\",\n      \"Luck is a story you tell your hands before the dice fall.\"\n    ]\n  },\n  {\n    id: \"map_memory\",\n    label: \"Mentally retrace your route\",\n    kind: \"skill\",\n    skill: \"Survival / Memory\",\n    ability: \"wis\",\n    dc: 11,\n    pass: [\n      \"Doors, turns, landmarks—your inner map sharpens. Retreat won't be panic if it comes.\",\n      \"You know where north pretends to be in this maze.\"\n    ],\n    fail: [\n      \"Streets shuffle when you're not looking. You'll navigate live.\",\n      \"Memory leaks; you hold what you can.\"\n    ]\n  },\n  {\n    id: \"cold_read_crowd\",\n    label: \"Glimpse crowd mood (quick read)\",\n    kind: \"skill\",\n    skill: \"Insight\",\n    ability: \"wis\",\n    dc: 12,\n    pass: [\n      \"Tension here is financial, not religious—purses tight, eyes on prices.\",\n      \"Celebration? Mourning? Neither—just exhaustion wearing different hats.\"\n    ],\n    fail: [\n      \"Too many stories at once. You get 'busy' and call it a day.\",\n      \"Crowds lie in aggregate.\"\n    ],\n    locations: {\n      market_square: {\n        pass: [\"Merchants laugh loud and mean it—sales are good, fear is selling better.\"]\n      }\n    }\n  },\n  {\n    id: \"test_wind\",\n    label: \"Feel wind on your skin\",\n    kind: \"flavor\",\n    lines: [\n      \"Wind finds the gaps in your cloak—honest, rude, useful.\",\n      \"Direction shifts; weather is thinking about changing its mind.\"\n    ],\n    locations: {\n      dockward: {\n        lines: [\"Salt wind shoves from the water, insistent as a creditor.\"]\n      },\n      mount_hotenow: {\n        lines: [\"Hot drafts lick upward—breath of something vast and sleepless below.\"]\n      }\n    }\n  },\n  {\n    id: \"shadow_box\",\n    label: \"Shadow-box / practice forms\",\n    kind: \"flavor\",\n    lines: [\n      \"Air yields; muscle remembers angles. A child watches, then pretends not to.\",\n      \"Sweat beads; you're not fighting, but your body doesn't believe you.\"\n    ]\n  },\n  {\n    id: \"read_posted_notice\",\n    label: \"Read a posted notice or sigil\",\n    kind: \"skill\",\n    skill: \"Investigation\",\n    ability: \"int\",\n    dc: 11,\n    pass: [\n      \"Edicts, prices, warnings—bureaucracy's poetry. One line contradicts another; interesting.\",\n      \"A sigil repeats: not guild, not temple—someone's private mark.\"\n    ],\n    fail: [\n      \"Ink ran; meaning didn't survive the rain.\",\n      \"Too many words. You skim and retain nothing.\"\n    ],\n    locations: {\n      protector_enclave: {\n        pass: [\"Recruitment tallies, curfew hours, ash advisories—command in fine print.\"]\n      }\n    }\n  },\n  {\n    id: \"taste_ash\",\n    label: \"Taste the air for ash (cautiously)\",\n    kind: \"flavor\",\n    lines: [\n      \"Bitter film on the tongue—distant fires, industry, or ritual. Hard to untangle.\",\n      \"You regret the curiosity. The aftertaste lingers.\"\n    ],\n    locations: {\n      mount_hotenow: {\n        lines: [\n          \"Ash isn't flavor—it's texture, heat, insult. You spit once, politely.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"check_time\",\n    label: \"Guess the hour by sun & bells\",\n    kind: \"skill\",\n    skill: \"Survival\",\n    ability: \"wis\",\n    dc: 10,\n    pass: [\n      \"Between bells and light, you place the hour close enough for planning.\",\n      \"Late afternoon—or early evening. Same hunger, different shadows.\"\n    ],\n    fail: [\n      \"Clouds mock sundials. You shrug.\",\n      \"Time is a rumor in a windowless alley.\"\n    ]\n  },\n  {\n    id: \"dodge_gutter\",\n    label: \"Leap a gutter / puddle (flair)\",\n    kind: \"skill\",\n    skill: \"Acrobatics\",\n    ability: \"dex\",\n    dc: 10,\n    pass: [\n      \"Dry boots, small pride. You'll take it.\",\n      \"A neat hop; a rat salutes. Possibly sarcastic.\"\n    ],\n    fail: [\n      \"Splash. Audience: pigeons. Verdict: unimpressed.\",\n      \"Mud claims a hem. The city always taxes.\"\n    ]\n  },\n  {\n    id: \"true_north\",\n    label: \"Orient yourself (true north feeling)\",\n    kind: \"skill\",\n    skill: \"Survival\",\n    ability: \"wis\",\n    dc: 11,\n    pass: [\n      \"Instinct points—maybe not true north, but a direction you can commit to.\",\n      \"The coast's memory lives in moss, smoke drift, star gaps. You hold a bearing.\"\n    ],\n    fail: [\n      \"Cities spin honest compasses. You're turned around politely.\",\n      \"North is a philosophy today, not a fact.\"\n    ]\n  },\n  {\n    id: \"scare_birds\",\n    label: \"Clap — startle roosting birds\",\n    kind: \"flavor\",\n    lines: [\n      \"Wings burst; complaints fill the air. Petty power, honest joy.\",\n      \"They resettle. You remember you're not the only restless thing here.\"\n    ]\n  },\n  {\n    id: \"borrow_light\",\n    label: \"Borrow light — study reflections\",\n    kind: \"skill\",\n    skill: \"Perception\",\n    ability: \"wis\",\n    dc: 12,\n    pass: [\n      \"Glass, water, polished bronze—angles show you a doorway you hadn't noticed.\",\n      \"Reflection lags half a heartbeat. Someone moved where you aren't looking.\"\n    ],\n    fail: [\n      \"All you see is yourself, tired and stubborn.\",\n      \"Glare wins. Optics lose.\"\n    ]\n  },\n  {\n    id: \"lie_in_grass\",\n    label: \"Lie back (if ground allows)\",\n    kind: \"flavor\",\n    lines: [\n      \"Stone isn't grass, but you flatten your spine anyway—sky replaces ceiling for a moment.\",\n      \"Vertigo and peace trade places. You sit up before judgment arrives.\"\n    ],\n    locations: {\n      graveyard_road: {\n        lines: [\n          \"The ground is cold through your cloak. Stars peer like curious jurors.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"barter_thought\",\n    label: \"Imagine haggling — price your soul (joke)\",\n    kind: \"flavor\",\n    lines: [\n      \"You'd start high; buyers would lowball; you'd meet in the middle at 'not today.'\",\n      \"Some things aren't for sale. You rehearse saying so with a smile.\"\n    ]\n  },\n  {\n    id: \"curse_soft\",\n    label: \"Curse the cult under your breath\",\n    kind: \"flavor\",\n    lines: [\n      \"Words small enough for privacy, sharp enough for satisfaction.\",\n      \"Vexira's name tastes like hot iron. You spit metaphorically.\"\n    ]\n  },\n  {\n    id: \"flex_charisma\",\n    label: \"Smile at a stranger (no stakes)\",\n    kind: \"skill\",\n    skill: \"Performance\",\n    ability: \"cha\",\n    dc: 10,\n    pass: [\n      \"They smile back—brief, human, free.\",\n      \"A nod exchanged. The city softens by a hair.\"\n    ],\n    fail: [\n      \"They look through you. Ouch.\",\n      \"Wrong smile, wrong moment. You study boots.\"\n    ]\n  },\n  {\n    id: \"intimidate_object\",\n    label: \"Threaten a stuck door or latch\",\n    kind: \"flavor\",\n    lines: [\n      \"\\\"Open,\\\" you whisper. It stays shut—discipline holds.\",\n      \"Violence reserved for wood that deserves it. This wasn't the moment.\"\n    ]\n  },\n  {\n    id: \"copy_footprint\",\n    label: \"Compare your boot to a print\",\n    kind: \"skill\",\n    skill: \"Investigation\",\n    ability: \"int\",\n    dc: 12,\n    pass: [\n      \"Not yours—longer toe, heavier tread. Someone armored or burdened passed recently.\",\n      \"Your sole matches nothing here. You're not the ghost they're tracking.\"\n    ],\n    fail: [\n      \"Mud lies. So do you, to yourself—'it's probably nothing.'\",\n      \"Prints smear into abstraction.\"\n    ]\n  },\n  {\n    id: \"sense_divine\",\n    label: \"Sense divine presence (quiet)\",\n    kind: \"skill\",\n    skill: \"Religion\",\n    ability: \"int\",\n    dc: 13,\n    pass: [\n      \"Something listens—not approval, attention. You offer respect and receive stillness.\",\n      \"Hallowed ground hums below indifference.\"\n    ],\n    fail: [\n      \"Silence feels empty, not holy.\",\n      \"If gods are here, they're whispering to someone else.\"\n    ],\n    locations: {\n      hall_of_justice: {\n        pass: [\"Torm's patience presses against impatience—order as warmth, not cold.\"]\n      }\n    }\n  },\n  {\n    id: \"measure_distance\",\n    label: \"Pace off a distance\",\n    kind: \"skill\",\n    skill: \"Investigation\",\n    ability: \"int\",\n    dc: 10,\n    pass: [\n      \"Rough yards logged—enough for spell ranges, throws, or paranoia.\",\n      \"Your stride is honest today.\"\n    ],\n    fail: [\n      \"You lose count at eleven. Classic.\",\n      \"Obstacles cheat; measurement abandons you.\"\n    ]\n  },\n  {\n    id: \"listen_own_breath\",\n    label: \"Listen to your own breathing\",\n    kind: \"flavor\",\n    lines: [\n      \"In, out—proof you're still in the story.\",\n      \"Fear thins when breath deepens. Biology negotiates with drama.\"\n    ]\n  },\n  {\n    id: \"name_fear\",\n    label: \"Name what you're afraid of\",\n    kind: \"flavor\",\n    lines: [\n      \"Ash. Failure. Becoming the kind of hero who burns villages to save them.\",\n      \"You give fear a name so it sits across from you instead of behind.\",\n      \"The list is long. You prioritize.\"\n    ]\n  },\n  {\n    id: \"check_sharpness\",\n    label: \"Thumb your blade's edge (carefully)\",\n    kind: \"skill\",\n    skill: \"Investigation\",\n    ability: \"int\",\n    dc: 10,\n    pass: [\n      \"Sharp enough. Honest bite without chatter.\",\n      \"One nick to true—smithing can wait, killing can't.\"\n    ],\n    fail: [\n      \"Paper-cut from hubris. Blood joins the lesson.\",\n      \"Duller than you thought. Note to self: maintain.\"\n    ]\n  },\n  {\n    id: \"stargaze_snippet\",\n    label: \"Find a patch of stars\",\n    kind: \"flavor\",\n    lines: [\n      \"Between smoke-haze, a few stubborn points of light. Navigation, myth, or both.\",\n      \"Constellations you half-know wink. No answers—company.\"\n    ],\n    locations: {\n      mount_hotenow: {\n        lines: [\n          \"Stars war with ash-cloud; the winners change by the minute.\"\n        ]\n      }\n    }\n  },\n  {\n    id: \"mock_toast\",\n    label: \"Raise an invisible toast\",\n    kind: \"flavor\",\n    lines: [\n      \"To the dead you'll avenge, the living you'll disappoint, the tavern you'll miss.\",\n      \"Glasses clink in imagination—cheaper than wine, warmer than water.\"\n    ]\n  },\n  {\n    id: \"copy_guards_stance\",\n    label: \"Mirror a guard's stance (practice)\",\n    kind: \"skill\",\n    skill: \"Performance\",\n    ability: \"cha\",\n    dc: 11,\n    pass: [\n      \"Posture borrows authority; you feel ridiculous and stronger.\",\n      \"Shoulders square; chin drops a fraction. Uniformity without uniform.\"\n    ],\n    fail: [\n      \"A guard clocks you. You look away like you meant to stretch.\",\n      \"You look like a child playing soldier.\"\n    ],\n    locations: {\n      protector_enclave: {\n        pass: [\"A sergeant almost nods—almost.\"]\n      }\n    }\n  },\n  {\n    id: \"feel_magic_skin\",\n    label: \"Feel for static / magic on your skin\",\n    kind: \"skill\",\n    skill: \"Arcana\",\n    ability: \"int\",\n    dc: 13,\n    pass: [\n      \"Hairs rise—not weather. Something woven nearby remembers power.\",\n      \"Your scars itch where old magic touched you. Echo, not wound.\"\n    ],\n    fail: [\n      \"Nothing. Either calm or you're numb to it.\",\n      \"Imagination supplies tingles; discipline dismisses them.\"\n    ]\n  },\n  {\n    id: \"juggle_thought\",\n    label: \"Juggle three worries — drop two\",\n    kind: \"flavor\",\n    lines: [\n      \"Sigils, gold, Vexira—you keep one, shelve the rest for later.\",\n      \"Anxiety is inventory management. You sort stacks.\",\n      \"Two fears go back in the pack. One walks with you.\"\n    ]\n  }\n];\n","src/data/items.js":"export const ITEMS = {\n  iron_ore: { id: \"iron_ore\", name: \"Iron Ore\", type: \"material\", value: 8 },\n  moonleaf: { id: \"moonleaf\", name: \"Moonleaf\", type: \"material\", value: 10 },\n  ember_shard: { id: \"ember_shard\", name: \"Ember Shard\", type: \"material\", value: 14 },\n  sigil_tide: { id: \"sigil_tide\", name: \"Tidal Sigil\", type: \"quest\", value: 0 },\n  sigil_shadow: { id: \"sigil_shadow\", name: \"Shadow Sigil\", type: \"quest\", value: 0 },\n  sigil_flame: { id: \"sigil_flame\", name: \"Flame Sigil\", type: \"quest\", value: 0 },\n  warded_key: { id: \"warded_key\", name: \"Warded Key\", type: \"quest\", value: 0 },\n  healing_potion: { id: \"healing_potion\", name: \"Healing Potion\", type: \"consumable\", value: 18, heal: \"2d4+2\" },\n  greater_healing_potion: { id: \"greater_healing_potion\", name: \"Greater Healing Potion\", type: \"consumable\", value: 45, heal: \"4d4+4\" },\n  elixir_of_strength: { id: \"elixir_of_strength\", name: \"Elixir of Strength\", type: \"consumable\", value: 50, buff: \"str\" },\n  revival_salt: { id: \"revival_salt\", name: \"Revival Salt\", type: \"consumable\", value: 30, revive: true },\n  steel_dagger: { id: \"steel_dagger\", name: \"Steel Dagger\", type: \"weapon\", value: 20 },\n  shadowsteel_dagger: { id: \"shadowsteel_dagger\", name: \"Shadowsteel Dagger\", type: \"weapon\", value: 75, bonusDamage: 4 },\n  arcane_focus: { id: \"arcane_focus\", name: \"Arcane Focus\", type: \"gear\", value: 25 },\n  warded_pendant: { id: \"warded_pendant\", name: \"Warded Pendant\", type: \"gear\", value: 60, acBonus: 2 }\n};\n\nexport const SHOP_STOCK = [\n  { itemId: \"healing_potion\", cost: 18 },\n  { itemId: \"greater_healing_potion\", cost: 45 },\n  { itemId: \"revival_salt\", cost: 30 },\n  { itemId: \"steel_dagger\", cost: 20 },\n  { itemId: \"arcane_focus\", cost: 25 },\n  { itemId: \"iron_ore\", cost: 8 },\n  { itemId: \"moonleaf\", cost: 10 },\n  { itemId: \"ember_shard\", cost: 14 }\n];\n\r\n","src/data/locations.js":"﻿/** Map layout: percentage positions inside the world-map canvas (0–100). */\nexport const LOCATIONS = [\n  {\n    id: \"protector_enclave\",\n    name: \"Protector's Enclave\",\n    description: \"The city center: banners, guards, and the pulse of high command.\",\n    travel: [\"market_square\", \"hall_of_justice\", \"dockward\", \"blacklake\"],\n    mapX: 50,\n    mapY: 52,\n    mapLabel: \"Enclave\"\n  },\n  {\n    id: \"market_square\",\n    name: \"Market Square\",\n    description: \"Merchants shout prices over wagons of salvaged metal and herbs.\",\n    travel: [\"protector_enclave\", \"crafting_hall\"],\n    mapX: 34,\n    mapY: 38,\n    mapLabel: \"Market\"\n  },\n  {\n    id: \"hall_of_justice\",\n    name: \"Hall of Justice\",\n    description: \"Marble halls where oaths, politics, and faith overlap.\",\n    travel: [\"protector_enclave\", \"graveyard_road\"],\n    mapX: 66,\n    mapY: 38,\n    mapLabel: \"Hall\"\n  },\n  {\n    id: \"dockward\",\n    name: \"Dockward\",\n    description: \"Salt spray, crooked lanterns, and eyes that never stop watching.\",\n    travel: [\"protector_enclave\", \"sunken_pier\"],\n    mapX: 28,\n    mapY: 64,\n    mapLabel: \"Docks\"\n  },\n  {\n    id: \"blacklake\",\n    name: \"Blacklake District\",\n    description: \"Ruined estates and hidden passageways haunted by old ambition.\",\n    travel: [\"protector_enclave\", \"graveyard_road\", \"mount_hotenow\"],\n    mapX: 58,\n    mapY: 72,\n    mapLabel: \"Blacklake\"\n  },\n  {\n    id: \"crafting_hall\",\n    name: \"Crafting Hall\",\n    description: \"An old smithy repurposed into a workshop for adventurers.\",\n    travel: [\"market_square\"],\n    mapX: 22,\n    mapY: 28,\n    mapLabel: \"Forge\"\n  },\n  {\n    id: \"graveyard_road\",\n    name: \"Neverdeath Approach\",\n    description: \"Fog and cracked stone mark the road to the city of graves.\",\n    travel: [\"hall_of_justice\", \"blacklake\", \"sunken_pier\"],\n    mapX: 74,\n    mapY: 54,\n    mapLabel: \"Graves\"\n  },\n  {\n    id: \"sunken_pier\",\n    name: \"Sunken Pier\",\n    description: \"Collapsed docks and smuggler caches half swallowed by dark tide.\",\n    travel: [\"dockward\", \"graveyard_road\"],\n    mapX: 24,\n    mapY: 82,\n    mapLabel: \"Pier\"\n  },\n  {\n    id: \"mount_hotenow\",\n    name: \"Mount Hotenow Rift\",\n    description: \"Heat fissures and ash storms surround Vexira's ritual ground.\",\n    travel: [\"blacklake\"],\n    mapX: 50,\n    mapY: 14,\n    mapLabel: \"Hotenow\"\n  }\n];\n\nexport const ENCOUNTERS = {\n  sunken_pier: {\n    id: \"sunken_pier_skirmish\",\n    title: \"Smuggler Ambush\",\n    description: \"Cult couriers rush for the boats as you close in.\",\n    enemy: {\n      id: \"smuggler_captain\",\n      name: \"Smuggler Captain\",\n      hp: 28,\n      ac: 13,\n      attackBonus: 4,\n      damage: \"1d8+2\",\n      xp: 70,\n      gold: 22,\n      loot: [\"sigil_tide\", \"moonleaf\"]\n    },\n    flagReward: \"tide_sigil_won\"\n  },\n  graveyard_road: {\n    id: \"graveyard_road_battle\",\n    title: \"Wight Sentinel\",\n    description: \"A grave-warden stitched with shadow bars your path.\",\n    enemy: {\n      id: \"wight_sentinel\",\n      name: \"Wight Sentinel\",\n      hp: 34,\n      ac: 14,\n      attackBonus: 5,\n      damage: \"1d10+2\",\n      xp: 90,\n      gold: 28,\n      loot: [\"sigil_shadow\", \"iron_ore\"]\n    },\n    flagReward: \"shadow_sigil_won\"\n  },\n  mount_hotenow: {\n    id: \"hotenow_pretrial\",\n    title: \"Ashbound Vanguard\",\n    description: \"Vexira's elite guard tests your strength at the rift gate.\",\n    enemy: {\n      id: \"ashbound_vanguard\",\n      name: \"Ashbound Vanguard\",\n      hp: 38,\n      ac: 15,\n      attackBonus: 6,\n      damage: \"1d10+3\",\n      xp: 110,\n      gold: 35,\n      loot: [\"sigil_flame\", \"ember_shard\"]\n    },\n    flagReward: \"flame_sigil_won\"\n  }\n};\n\nexport const FINAL_BOSS = {\n  id: \"vexira_boss\",\n  name: \"Vexira the Ashbound\",\n  hp: 70,\n  ac: 16,\n  attackBonus: 7,\n  damage: \"2d8+3\",\n  xp: 250,\n  gold: 120,\n  loot: []\n};\n","src/data/npcs.js":"﻿/**\n * @typedef {object} NpcDialogueTopic\n * @property {string} id\n * @property {string} label\n * @property {string[]} lines — shown as dialogue when chosen\n * @property {Record\u003cstring, boolean>} [needFlags] — topic hidden unless each flag matches (true/false)\n * @property {string} [needActiveQuest]\n * @property {string} [needInactiveQuest]\n * @property {\"open_shop\"|\"elira_heal\"|\"harper_payout\"} [effect] — handled in main.js\n */\n\nexport const NPCS = [\n  {\n    id: \"serra\",\n    name: \"Captain Serra\",\n    locationId: \"protector_enclave\",\n    faction: \"lords\",\n    greeting: \"Neverwinter needs operatives who can move quietly and strike hard.\",\n    questHook: \"main_quest\",\n    topics: [\n      {\n        id: \"briefing\",\n        label: \"Ask for a proper briefing\",\n        lines: [\n          \"Serra unrolls a charcoal map streaked with ash drift.\",\n          \"\\\"Vexira anchors a ritual on Mount Hotenow. She needs three ward sigils—tide, shadow, and flame—unbound from our defenses.\\\"\",\n          \"\\\"Recover them, have a smith weave the Warded Key, then end her before the rift eats the city.\\\"\"\n        ]\n      },\n      {\n        id: \"neverwinter\",\n        label: \"How is the city holding?\",\n        lines: [\n          \"\\\"We've survived worse than ash storms,\\\" she says quietly.\",\n          \"\\\"But fear spreads faster than fire. People need to see someone willing to walk into the smoke and come back.\\\"\"\n        ]\n      },\n      {\n        id: \"lords_alliance\",\n        label: \"What does the Lords' Alliance want from me?\",\n        lines: [\n          \"\\\"Discretion, speed, and no grandstanding,\\\" Serra answers.\",\n          \"\\\"Report to me or Lord Neverember. Don't sell what you learn to the first gossip with coin.\\\"\"\n        ]\n      },\n      {\n        id: \"sigils\",\n        label: \"Where might the sigils be?\",\n        lines: [\n          \"\\\"Intelligence points to Sunken Pier, Neverdeath Approach, and the rift approaches below Hotenow.\\\"\",\n          \"\\\"Expect cult escorts at each site. They won't let the sigils go quietly.\\\"\"\n        ],\n        needInactiveQuest: \"main_quest\"\n      },\n      {\n        id: \"after_victory\",\n        label: \"Neverwinter is safe—what now?\",\n        lines: [\n          \"Serra's salute is crisp, almost tender.\",\n          \"\\\"Rest. Let the healers fuss. Then decide if you're a visitor or one of us. The gate stays open either way.\\\"\"\n        ],\n        needFlags: { defeatedVexira: true }\n      }\n    ]\n  },\n  {\n    id: \"brom\",\n    name: \"Brom Ironmantle\",\n    locationId: \"market_square\",\n    faction: \"enclave\",\n    greeting: \"Steel, grit, and a little patience solve most things.\",\n    shop: true,\n    topics: [\n      {\n        id: \"trade\",\n        label: \"I'd like to see your wares\",\n        lines: [\"Brom sweeps an arm toward crates of bundled steel and corked vials.\", \"\\\"Honest prices. No questions about why you need a third dagger.\\\"\"],\n        effect: \"open_shop\"\n      },\n      {\n        id: \"neverwinter_trade\",\n        label: \"How's business with the city on edge?\",\n        lines: [\n          \"\\\"Fear buys armor as fast as courage does,\\\" Brom grunts.\",\n          \"\\\"I'd rather sell to happy folk, but I'll settle for alive ones.\\\"\"\n        ]\n      },\n      {\n        id: \"cult\",\n        label: \"Seen any cult buyers?\",\n        lines: [\n          \"\\\"Shadowy types asking for silvered wire and rare inks—paid well, smelled wrong.\\\"\",\n          \"\\\"I sell metal, not sermons. If you follow them, watch your back.\\\"\"\n        ]\n      },\n      {\n        id: \"advice\",\n        label: \"Any advice for a new blade in town?\",\n        lines: [\n          \"\\\"Keep your shield arm loose, your purse tighter, and don't drink Dockward wine unless you trust the server.\\\"\",\n          \"\\\"Oh—and buy a potion before you need one.\\\"\"\n        ]\n      }\n    ]\n  },\n  {\n    id: \"elira\",\n    name: \"Elira Dawn\",\n    locationId: \"hall_of_justice\",\n    faction: \"gauntlet\",\n    greeting: \"Duty without compassion is only another kind of tyranny.\",\n    heal: true,\n    topics: [\n      {\n        id: \"blessing\",\n        label: \"Request a blessing and healing\",\n        lines: [\"Elira presses warm hands to your shoulders.\", \"\\\"Torm's strength is in the standing, not the falling. Let me ease what the road has taken.\\\"\"],\n        effect: \"elira_heal\"\n      },\n      {\n        id: \"torm\",\n        label: \"Tell me about Torm's justice\",\n        lines: [\n          \"\\\"Justice without mercy is a blade with no hilt,\\\" she says.\",\n          \"\\\"We judge deeds, not whispers. If you act with honor here, you'll find friends in this hall.\\\"\"\n        ]\n      },\n      {\n        id: \"neverember\",\n        label: \"What do you think of Lord Neverember?\",\n        lines: [\n          \"\\\"A pragmatist with a king's appetite,\\\" Elira replies carefully.\",\n          \"\\\"He keeps Neverwinter standing. My order watches that ambition doesn't trample the vulnerable.\\\"\"\n        ]\n      },\n      {\n        id: \"cult_threat\",\n        label: \"How should we handle the ash cult?\",\n        lines: [\n          \"\\\"With clarity,\\\" she says. \\\"They prey on despair. Show people the city still protects them—that cuts deeper than any spell.\\\"\"\n        ]\n      }\n    ]\n  },\n  {\n    id: \"kael\",\n    name: \"Kael Quickstep\",\n    locationId: \"dockward\",\n    faction: \"harpers\",\n    greeting: \"I hear things before they happen. Usually.\",\n    rumor: true,\n    topics: [\n      {\n        id: \"docks\",\n        label: \"What's the word on the docks?\",\n        lines: [\n          \"\\\"Boats running shy of tariffs, couriers using tide caves, the usual Dockward ballet.\\\"\",\n          \"\\\"Lately, though, the wrong crates are moving too fast—sigil-marked, ash-scented.\\\"\"\n        ]\n      },\n      {\n        id: \"harpers\",\n        label: \"Why help a stranger?\",\n        lines: [\n          \"\\\"Because silence is a choice,\\\" Kael says with a half-smile.\",\n          \"\\\"Harpers listen. Sometimes we nudge. Sometimes we hand someone a lantern and hope they walk toward the fire.\\\"\"\n        ]\n      },\n      {\n        id: \"smuggler_tip\",\n        label: \"Any leads on the smuggler chain?\",\n        lines: [\n          \"\\\"Talk to Tormund in Blacklake if you want work with receipts,\\\" they murmur.\",\n          \"\\\"If you clear the pier cache, come back—I know people who pay for clean harbors.\\\"\"\n        ],\n        needInactiveQuest: \"smuggler_chain\"\n      },\n      {\n        id: \"collect_pay\",\n        label: \"The pier cache is dealt with. About that payment…\",\n        lines: [\n          \"Kael slides a wrapped bundle across the table.\",\n          \"\\\"Harper coin, Harper thanks. Try not to spend it all on Dockward trouble.\\\"\"\n        ],\n        needActiveQuest: \"smuggler_chain\",\n        needFlags: { smugglerCleared: true },\n        effect: \"harper_payout\"\n      }\n    ]\n  },\n  {\n    id: \"whisper\",\n    name: \"Whisper\",\n    locationId: \"blacklake\",\n    faction: \"zhentarim\",\n    greeting: \"Secrets have weight. Pay enough, and I might share one.\",\n    rumor: true,\n    topics: [\n      {\n        id: \"blacklake\",\n        label: \"What hides in Blacklake?\",\n        lines: [\n          \"\\\"Old money, old grudges, and tunnels that remember every footstep,\\\" Whisper breathes.\",\n          \"\\\"The Zhentarim aren't the only ones listening—but we're the ones who sell answers.\\\"\"\n        ]\n      },\n      {\n        id: \"vexira_price\",\n        label: \"What would Vexira pay for me to walk away?\",\n        lines: [\n          \"\\\"Your life, cheaply,\\\" they say. \\\"Power, dearly.\\\"\",\n          \"\\\"If you're asking, you're not for sale. Good. Dead heroes don't tip.\\\"\"\n        ]\n      },\n      {\n        id: \"tormund\",\n        label: \"Who's reliable in this district?\",\n        lines: [\n          \"\\\"Tormund Vale asks too many noble questions for a Harper, but he pays on time.\\\"\",\n          \"\\\"If you're hunting cult cargo, he's your next conversation.\\\"\"\n        ]\n      },\n      {\n        id: \"collect_pay\",\n        label: \"Smuggler problem solved. I believe I'm owed.\",\n        lines: [\n          \"Whisper counts coins without looking.\",\n          \"\\\"Pleasure doing honest business in dishonest places. Don't make me regret the introduction.\\\"\"\n        ],\n        needActiveQuest: \"smuggler_chain\",\n        needFlags: { smugglerCleared: true },\n        effect: \"harper_payout\"\n      }\n    ]\n  },\n  {\n    id: \"neverember\",\n    name: \"Lord Neverember\",\n    locationId: \"hall_of_justice\",\n    faction: \"lords\",\n    greeting: \"If Neverwinter stands, it stands because people choose to act.\",\n    topics: [\n      {\n        id: \"city\",\n        label: \"How do you keep Neverwinter united?\",\n        lines: [\n          \"\\\"Bread, walls, and the illusion that someone is in charge,\\\" Neverember says dryly.\",\n          \"\\\"Then I pray brave fools like you give the people something real to believe in.\\\"\"\n        ]\n      },\n      {\n        id: \"serra\",\n        label: \"Should I trust Captain Serra?\",\n        lines: [\n          \"\\\"With your life? Perhaps. With polite dinner conversation? Questionable,\\\" he allows a thin smile.\",\n          \"\\\"She's loyal to the city first. That makes her predictable—in the best way.\\\"\"\n        ]\n      },\n      {\n        id: \"vexira\",\n        label: \"What do you know of Vexira?\",\n        lines: [\n          \"\\\"A zealot who found a volcano and called it destiny,\\\" he says, voice hardening.\",\n          \"\\\"She would burn the Coast to remake it. Stop her, and debts between us can be discussed.\\\"\"\n        ]\n      },\n      {\n        id: \"before_quest\",\n        label: \"Where should I begin?\",\n        lines: [\n          \"\\\"Serra holds the writ and the map,\\\" Neverember says.\",\n          \"\\\"Don't make me repeat myself—the ash won't wait for pleasantries.\\\"\"\n        ],\n        needFlags: { acceptedMainQuest: false }\n      }\n    ]\n  },\n  {\n    id: \"tormund\",\n    name: \"Tormund Vale\",\n    locationId: \"blacklake\",\n    faction: \"harpers\",\n    greeting: \"Shadow cultists are moving components through the old estate routes.\",\n    sideQuest: \"smuggler_chain\",\n    topics: [\n      {\n        id: \"smugglers\",\n        label: \"Tell me about the smuggler cache\",\n        lines: [\n          \"\\\"Cult runners are staging at Sunken Pier—tide makes their boats brave,\\\" Tormund says.\",\n          \"\\\"Clear them, and the Harpers will make sure your purse remembers the favor.\\\"\"\n        ]\n      },\n      {\n        id: \"estates\",\n        label: \"What happened to the old estates?\",\n        lines: [\n          \"\\\"Pride, debt, and a few very bad decisions,\\\" he sighs.\",\n          \"\\\"Now the cellars echo with footsteps that don't belong to heirs anymore.\\\"\"\n        ]\n      },\n      {\n        id: \"harpers_goal\",\n        label: \"What do the Harpers want here?\",\n        lines: [\n          \"\\\"Balance,\\\" Tormund answers. \\\"No throne too heavy, no shadow too deep to map.\\\"\",\n          \"\\\"Right now, that means keeping sigils out of the wrong hands—and yours in the right ones.\\\"\"\n        ]\n      },\n      {\n        id: \"after_brief\",\n        label: \"Any update on the pier?\",\n        lines: [\n          \"\\\"If you haven't cleared it, stop chatting and start stabbing,\\\" he says gently.\",\n          \"\\\"If you have, Kael or Whisper owes you a drink and a purse.\\\"\"\n        ],\n        needFlags: { smugglerBriefed: true }\n      }\n    ]\n  },\n  {\n    id: \"miri\",\n    name: \"Miri Ashwood\",\n    locationId: \"market_square\",\n    faction: \"enclave\",\n    greeting: \"Give me ore and herbs, and I can turn them into miracles.\",\n    craftingGuide: true,\n    topics: [\n      {\n        id: \"warded_key\",\n        label: \"How do I forge the Warded Key?\",\n        lines: [\n          \"\\\"Three sigils—tide, shadow, flame—plus iron, ember shard, and moonleaf at my cousin's bench in the Crafting Hall,\\\" Miri recites.\",\n          \"\\\"Work carefully. The key hums when the weave is true; if it screams, step back.\\\"\"\n        ]\n      },\n      {\n        id: \"materials\",\n        label: \"Where do I find rare materials?\",\n        lines: [\n          \"\\\"Ore whispers to miners; ember shard favors ash vents; moonleaf likes moonlit ruins,\\\" she says.\",\n          \"\\\"Or buy from Brom when the road is mean—I'm not judging your supply chain.\\\"\"\n        ]\n      },\n      {\n        id: \"cousin\",\n        label: \"Why the Crafting Hall and not here?\",\n        lines: [\n          \"\\\"Regulations, smoke, and one very nosy tax clerk,\\\" Miri laughs.\",\n          \"\\\"The hall has the warded forge circle. My stall would turn into a crater.\\\"\"\n        ]\n      },\n      {\n        id: \"open_craft\",\n        label: \"I'm ready to use the crafting bench\",\n        lines: [\n          \"\\\"The warded circle is in the Crafting Hall—through the market arch,\\\" Miri says.\",\n          \"\\\"Once you're there, lay the sigils with care. If the key screams, step back and breathe.\\\"\"\n        ]\n      }\n    ]\n  },\n  {\n    id: \"vexira\",\n    name: \"Vexira the Ashbound\",\n    locationId: \"mount_hotenow\",\n    faction: \"zhentarim\",\n    greeting: \"You crossed storms and graves for this? Then burn with them.\",\n    boss: true,\n    topics: [\n      {\n        id: \"ritual\",\n        label: \"What is the ritual for?\",\n        lines: [\n          \"\\\"To peel the lie of safety from this coast,\\\" Vexira says, embers crawling along her fingertips.\",\n          \"\\\"You cling to crumbling walls. I offer a baptism of ash and truth.\\\"\"\n        ]\n      },\n      {\n        id: \"surrender\",\n        label: \"Stand down—it's not too late\",\n        lines: [\n          \"She laughs, low and hungry.\",\n          \"\\\"It was too late when your ancestors built on a sleeping fire. I merely wake it.\\\"\"\n        ]\n      },\n      {\n        id: \"key\",\n        label: \"The Warded Key will stop you\",\n        lines: [\n          \"\\\"Then bring it,\\\" she whispers.\",\n          \"\\\"Let us see whether your craft is stronger than my conviction.\\\"\"\n        ],\n        needFlags: { forgedWardedKey: true }\n      },\n      {\n        id: \"taunt\",\n        label: \"You're afraid—otherwise you'd have struck already\",\n        lines: [\n          \"\\\"I savor anticipation,\\\" Vexira replies.\",\n          \"\\\"Fear and hunger taste the same on the tongue. You'll learn—briefly.\\\"\"\n        ]\n      }\n    ]\n  }\n];\n","src/data/quests.js":"﻿export const QUESTS = {\n  main_quest: {\n    id: \"main_quest\",\n    name: \"Ash Over Neverwinter\",\n    summary: \"Recover three sigils, forge a warded key, and stop Vexira's ritual.\",\n    stages: [\n      \"Receive mission from Captain Serra.\",\n      \"Recover the Tidal, Shadow, and Flame Sigils.\",\n      \"Craft the Warded Key in the Crafting Hall.\",\n      \"Defeat Vexira at Mount Hotenow.\",\n      \"Return to Protector's Enclave for epilogue.\"\n    ]\n  },\n  smuggler_chain: {\n    id: \"smuggler_chain\",\n    name: \"Broken Chain\",\n    summary: \"Disrupt smuggler supply lines feeding Vexira's cult.\",\n    stages: [\n      \"Get intel from Tormund.\",\n      \"Clear Sunken Pier cache.\",\n      \"Report to Whisper or Kael for reward.\"\n    ]\n  }\n};\r\n","src/data/races.js":"﻿export const RACES = [\n  {\n    id: \"human\",\n    name: \"Human\",\n    description: \"Adaptable and resilient adventurers from every corner of the coast.\",\n    traits: \"+1 to all abilities\",\n    bonuses: { str: 1, dex: 1, con: 1, int: 1, wis: 1, cha: 1 }\n  },\n  {\n    id: \"elf\",\n    name: \"Elf\",\n    description: \"Keen-eyed wanderers with grace and magical intuition.\",\n    traits: \"+2 DEX, +1 INT\",\n    bonuses: { str: 0, dex: 2, con: 0, int: 1, wis: 0, cha: 0 }\n  },\n  {\n    id: \"dwarf\",\n    name: \"Dwarf\",\n    description: \"Stone-tested defenders known for grit and discipline.\",\n    traits: \"+2 CON, +1 WIS\",\n    bonuses: { str: 0, dex: 0, con: 2, int: 0, wis: 1, cha: 0 }\n  },\n  {\n    id: \"halfling\",\n    name: \"Halfling\",\n    description: \"Quick, lucky, and quietly fearless under pressure.\",\n    traits: \"+2 DEX, +1 CHA\",\n    bonuses: { str: 0, dex: 2, con: 0, int: 0, wis: 0, cha: 1 }\n  },\n  {\n    id: \"tiefling\",\n    name: \"Tiefling\",\n    description: \"Clever survivors marked by infernal legacy.\",\n    traits: \"+2 CHA, +1 INT\",\n    bonuses: { str: 0, dex: 0, con: 0, int: 1, wis: 0, cha: 2 }\n  },\n  {\n    id: \"dragonborn\",\n    name: \"Dragonborn\",\n    description: \"Proud warriors carrying draconic presence and force.\",\n    traits: \"+2 STR, +1 CHA\",\n    bonuses: { str: 2, dex: 0, con: 0, int: 0, wis: 0, cha: 1 }\n  }\n];\r\n","src/data/recipes.js":"export const RECIPES = [\n  {\n    id: \"warded_key_recipe\",\n    name: \"Warded Key\",\n    resultItemId: \"warded_key\",\n    resultQty: 1,\n    requires: [\n      { itemId: \"sigil_tide\", qty: 1 },\n      { itemId: \"sigil_shadow\", qty: 1 },\n      { itemId: \"sigil_flame\", qty: 1 },\n      { itemId: \"iron_ore\", qty: 1 },\n      { itemId: \"moonleaf\", qty: 1 },\n      { itemId: \"ember_shard\", qty: 1 }\n    ],\n    description: \"A keyed ward that can break Vexira's barrier.\"\n  },\n  {\n    id: \"greater_healing_potion_recipe\",\n    name: \"Greater Healing Potion\",\n    resultItemId: \"greater_healing_potion\",\n    resultQty: 1,\n    requires: [\n      { itemId: \"healing_potion\", qty: 2 },\n      { itemId: \"moonleaf\", qty: 2 }\n    ],\n    description: \"Concentrated healing elixir restoring 4d4+4 HP.\"\n  },\n  {\n    id: \"shadowsteel_dagger_recipe\",\n    name: \"Shadowsteel Dagger\",\n    resultItemId: \"shadowsteel_dagger\",\n    resultQty: 1,\n    requires: [\n      { itemId: \"steel_dagger\", qty: 1 },\n      { itemId: \"ember_shard\", qty: 2 },\n      { itemId: \"iron_ore\", qty: 2 }\n    ],\n    description: \"Formidable forged blade imbued with shadow magic (+4 bonus damage).\"\n  }\n];\n\r\n","src/data/spells.js":"﻿export const SPELLS = [\n  {\n    id: \"fire_bolt\",\n    name: \"Fire Bolt\"

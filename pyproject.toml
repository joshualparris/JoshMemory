[project]
name = "joshmemory"
version = "0.3.0"
description = "Evidence-aware project continuity, coordination and memory governance for coding agents."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
joshmemory = "joshmemory.cli:main"
joshmemory-central = "joshmemory.central:main"
joshmemory-continuity = "joshmemory.continuity_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["joshmemory*"]

[project.optional-dependencies]
dev = ["pytest"]

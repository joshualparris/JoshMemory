[project]
name = "joshmemory"
version = "0.2.0"
description = "Searchable evidence and project-memory index with local and central handoff storage."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
joshmemory = "joshmemory.cli:main"
joshmemory-central = "joshmemory.central:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["joshmemory*"]

[project.optional-dependencies]
dev = ["pytest"]

name: Bootstrap supplied NSW Narromine cadastral dataset
on:
  push:
    branches:
      - feat/narromine-lot-boundaries-20261106
    paths:
      - .github/workflows/narromine-lots-bootstrap-20261106.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate NSW Spatial Services Lot layer 9 from authoritative public API
        working-directory: repository-town
        run: |
          node tools/narromine-lots.mjs --fetch
          node --input-type=module -e 'import {NARROMINE_LOTS} from "./src/world/narromine-lots-data.js"; if(NARROMINE_LOTS.lots.length<1800 || NARROMINE_LOTS.lots.length>2600) throw Error("Incomplete lot import"); console.log("Verified public lot rings:",NARROMINE_LOTS.lots.length)'
          sha256sum src/world/narromine-lots-data.js
      - name: Commit generated public dataset only to claimed feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repository-town/src/world/narromine-lots-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'data(narromine): import NSW cadastral lot outlines with attribution'
            git push origin HEAD:feat/narromine-lot-boundaries-20261106
          else
            echo 'Generated cadastral data unchanged'
          fi

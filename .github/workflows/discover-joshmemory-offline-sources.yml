name: Discover JoshMemory offline podcast sources
on:
  push:
    branches: [main]
    paths:
      - 'tools/discover-joshmemory-offline-sources.mjs'
      - '.github/workflows/discover-joshmemory-offline-sources.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover official episode media through Apple podcast metadata
        run: node tools/discover-joshmemory-offline-sources.mjs
      - name: Commit discovery report
        run: |
          if git diff --quiet -- docs/research/offline-podcast-source-candidates.json; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/offline-podcast-source-candidates.json
          git commit -m "research: map podcast recommendations to official media"
          git push

name: Narromine real vehicle model and moving traffic browser verification
on:
  pull_request:
    paths:
      - 'repository-town/tests/narromine-traffic-vehicles-browser.mjs'
      - '.github/workflows/narromine-traffic-vehicles-qa.yml'
      - 'repository-town/src/world/narromine-traffic.js'
      - 'repository-town/src/world/narromine-vehicle-models.js'
      - 'repository-town/src/world/narromine-trains.js'
      - 'repository-town/src/main.js'
      - 'repository-town/src/assets/vehicles/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cars:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install and verify release source
        working-directory: repository-town
        run: |
          npm ci --no-audit --no-fund
          npm run build:deploy
      - name: Assert Narromine school-run pedestrians, collision-free parking and weekly trip rollover
        working-directory: repository-town
        run: |
          node tests/narromine-pedestrians.mjs
          node tests/narromine-residents.mjs
          node tests/narromine-coles-supply.mjs
      - name: Install Chromium
        working-directory: repository-town
        run: npx playwright install --with-deps chromium
      - name: Play actual GLB models and traffic in desktop and phone Chromium
        working-directory: repository-town
        env:
          TOWN_URL: http://127.0.0.1:8091/
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          node tools/serve.mjs dist/public 8091 >/tmp/narromine-traffic-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/narromine-traffic-vehicles-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narromine-vehicle-webgl-${{ github.run_id }}
          path: repository-town/test-results/narromine-traffic-vehicles/
          retention-days: 14
          if-no-files-found: warn

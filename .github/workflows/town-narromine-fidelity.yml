name: Narromine Building Fidelity Inventory & Map

on:
  pull_request:
    paths:
      - 'repository-town/data/narromine-*.json'
      - 'repository-town/tools/narromine-inventory.mjs'
      - 'repository-town/src/narromine-progress.html'
      - 'repository-town/tests/narromine-inventory.mjs'
      - 'repository-town/tests/narromine-progress-browser.mjs'
      - 'repository-town/tools/build.mjs'
      - '.github/workflows/town-narromine-fidelity.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/data/narromine-*.json'
      - 'repository-town/tools/narromine-inventory.mjs'
      - 'repository-town/src/narromine-progress.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated survey baseline and underlying geometry
        run: |
          node --check tools/narromine-inventory.mjs
          node tests/narromine-inventory.mjs
          node tests/narromine-layout.mjs
      - name: Build and privacy check
        run: |
          npm run build
          npm run check:privacy
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Visually exercise progress map on desktop and mobile
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          node tools/serve.mjs dist/public 8091 >/tmp/narromine-progress-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/narromine-progress.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/narromine-progress-browser.mjs --url http://127.0.0.1:8091/
          node tests/narromine-progress-browser.mjs --mobile --url http://127.0.0.1:8091/
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narromine-building-map-desktop-android
          path: repository-town/test-results/narromine-progress/
          retention-days: 14
          if-no-files-found: warn

name: Narromine NR-REAL-002 Real Walking Audit

on:
  push:
    branches:
      - feat/narromine-real-002-walk-qa-continuation-20261105
    paths:
      - 'repository-town/tests/narromine-real-002-walking-audit-browser.mjs'
      - 'repository-town/docs/NARROMINE_REAL_002_WALKING_AUDIT_2026-11-05.md'
      - '.github/workflows/narromine-real-002-walking-audit.yml'
  pull_request:
    paths:
      - 'repository-town/tests/narromine-real-002-walking-audit-browser.mjs'
      - '.github/workflows/narromine-real-002-walking-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nr-real-002-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-mobile-real-webgl-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax and geospatial/entrance source checks
        run: |
          node --check tests/narromine-real-002-walking-audit-browser.mjs
          node tests/narromine-layout.mjs
          node tests/narromine-aviation-precinct.mjs
          node tests/narromine-courthouse-precinct.mjs
          node tests/narromine-royal-hotel.mjs
      - name: Build and verify privacy
        run: |
          npm run build
          npm run check:privacy
      - name: Install full Chromium WebGL dependencies
        run: npx playwright install --with-deps chromium
      - name: Physically walk ten local Narromine segments at desktop and phone size
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SOURCE_SHA: ${{ github.sha }}
        run: node tests/narromine-real-002-walking-audit-browser.mjs
      - name: Verify machine-readable route counts
        run: |
          node --input-type=module -e "import fs from 'node:fs';const a=JSON.parse(fs.readFileSync('test-results/narromine-real-002/audit.json'));if(a.viewports.length!==2||a.viewports.some(v=>v.results.length!==10))throw Error('Missing one of 20 local walking attempts');console.log('Recorded '+a.passed+' walked segments, '+a.gaps+' audit gaps; not full-town continuous physical traversal');"
      - name: Preserve full JSON audit and 20 game-only screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narromine-real-002-desktop-mobile-walking-evidence
          path: repository-town/test-results/narromine-real-002/
          retention-days: 21
          if-no-files-found: warn

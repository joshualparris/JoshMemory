name: Narromine Performance Route (desktop + Android emulation)
on:
  pull_request:
    paths:
      - 'repository-town/tools/narromine-visual-qa/perf-route.mjs'
      - 'repository-town/tools/narromine-visual-qa/locations.mjs'
      - 'repository-town/tools/narromine-visual-qa/run.mjs'
      - 'repository-town/src/ui/perf-meter.js'
      - '.github/workflows/narromine-perf-route.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  perf-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the real game
        run: npm run build
      - name: Install real Chromium with SwiftShader dependencies
        run: npx playwright install --with-deps chromium
      - name: Measure frame time, draw calls and triangles along the route
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node tools/narromine-visual-qa/perf-route.mjs
      - name: Preserve performance artifacts (JSON + CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narromine-perf-route-${{ github.run_id }}
          path: repository-town/test-results/narromine-perf/
          retention-days: 14
          if-no-files-found: warn

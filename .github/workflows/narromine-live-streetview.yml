name: Narromine Live Street View Comparison QA

on:
  pull_request:
    paths:
      - 'repository-town/tools/narromine-visual-qa/live-streetview/**'
      - 'repository-town/tests/narromine-live-streetview.mjs'
      - '.github/workflows/narromine-live-streetview.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/tools/narromine-visual-qa/live-streetview/**'
      - 'repository-town/tests/narromine-live-streetview.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narromine-live-streetview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: No surprise API calls, cost ledger and camera matching
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Syntax-check standalone comparison module
        run: |
          node --check tools/narromine-visual-qa/live-streetview/server.mjs
          node --check tools/narromine-visual-qa/live-streetview/app.js
          node --check tools/narromine-visual-qa/live-streetview/presets.mjs
      - name: Browser acceptance without calling Google
        run: node tests/narromine-live-streetview.mjs
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

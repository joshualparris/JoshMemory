name: Council proposed park route distances (195 homes)
on:
  pull_request:
    paths:
      - '.github/workflows/council-park-routes.yml'
      - 'repository-town/src/world/council-park-routes.js'
      - 'repository-town/tests/council-park-routes.mjs'
      - 'repository-town/src/world/masterplan-model.js'
      - 'repository-town/src/world/masterplan-built.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/council-park-routes.yml'
      - 'repository-town/src/world/council-park-routes.js'
      - 'repository-town/tests/council-park-routes.mjs'
      - 'repository-town/src/world/masterplan-model.js'
      - 'repository-town/src/world/masterplan-built.js'
permissions:
  contents: read
jobs:
  proposed-route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Verify 195 proposed homes' road-route distance graph and fail-closed constraints
        working-directory: repository-town
        run: |
          npm ci --no-audit --no-fund
          node tests/council-park-routes.mjs
          npm run build
          node tools/check_privacy.mjs

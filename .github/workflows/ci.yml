name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # These only exercise the already-registered Windows runner.
      # Do not spend hosted Linux CI minutes for CI diagnostic files alone.
      - '.github/workflows/windows-self-hosted-smoke.yml'
      - '.github/workflows/windows-cross-repo-syntax.yml'
  pull_request:
    paths-ignore:
      - 'repository-town/**'
      - '.github/workflows/town-*.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q joshmemory
      - name: Check Privacy
        env:
          JOSHMEMORY_PRIVATE_TERMS: ${{ secrets.JOSHMEMORY_PRIVATE_TERMS }}
        run: python tools/check_privacy.py
      - name: Validate shell deploy scripts
        run: bash -n deploy/*.sh
      - name: Test
        run: pytest -q

  cloud-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t joshmemory-cloud:ci .

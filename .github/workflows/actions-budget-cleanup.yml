name: Actions budget cleanup — superseded runs only
# Runs once when this file is first added, and subsequently only if manually
# dispatched or this file changes. Does not cancel the newest active check.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-budget-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel older duplicate runs but preserve the latest per workflow and branch
        uses: actions/github-script@v7
        with:
          script: |
            const active = new Map();
            for (const status of ['queued', 'in_progress', 'waiting', 'pending']) {
              try {
                const found = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  ...context.repo, status, per_page: 100
                });
                for (const run of found) {
                  if (run.id === context.runId || run.event === 'workflow_dispatch') continue;
                  active.set(run.id, run);
                }
              } catch (error) {
                core.warning(`Could not list ${status}: ${error.message}`);
              }
            }
            const group = run => [
              run.workflow_id, run.head_repository?.full_name || context.repo.owner,
              run.head_branch || '', run.event,
              run.pull_requests?.[0]?.number || ''
            ].join('|');
            const latest = new Map();
            for (const run of active.values()) {
              const key = group(run);
              const prev = latest.get(key);
              if (!prev || Date.parse(run.created_at) > Date.parse(prev.created_at) ||
                (run.created_at === prev.created_at && run.id > prev.id)) latest.set(key, run);
            }
            let cancelled = 0, failed = 0;
            for (const run of active.values()) {
              if (latest.get(group(run))?.id === run.id) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id:run.id});
                core.info(`Cancelled superseded run ${run.id}: ${run.name} (${run.head_branch})`);
                cancelled++;
              } catch (error) {
                core.warning(`Cannot cancel ${run.id}: ${error.message}`);
                failed++;
              }
            }
            core.info(`Active examined: ${active.size}; superseded cancelled: ${cancelled}; failed: ${failed}`);
            await core.summary.addHeading('GitHub Actions budget cleanup')
              .addRaw(`Examined ${active.size} active runs. Cancelled ${cancelled} superseded runs; ${failed} cancellations failed. Newest checks and manual dispatches were preserved.`)
              .write();

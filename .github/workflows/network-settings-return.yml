name: Network settings return regression
on:
  pull_request:
    paths:
      - 'repository-town/games/whirring-wilderness/network/settings.html'
      - 'repository-town/tests/network-settings-return.mjs'
      - '.github/workflows/network-settings-return.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/games/whirring-wilderness/network/settings.html'
      - 'repository-town/tests/network-settings-return.mjs'
      - '.github/workflows/network-settings-return.yml'
permissions:
  contents: read
jobs:
  offline-return-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Test only owned-page return navigation in a mocked browser
        working-directory: repository-town
        run: node --test tests/network-settings-return.mjs

name: OmniCode polyglot CI
on:
  push:
    paths: ['omnicode/**', '.github/workflows/omnicode.yml']
  pull_request:
    paths: ['omnicode/**', '.github/workflows/omnicode.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install adapter runtimes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends php-cli default-jdk build-essential perl gawk
      - name: Build adapters and run full integration tests
        working-directory: omnicode
        run: bash scripts/build.sh && go test ./... -v && node --check site/app.js && node --check site/api/audit.js && node --check site/api/health.js && node --check site/catalogue.js && node --test site/catalogue.test.cjs && node --check site/api/translate.js && node --check site/translator.js && node --test tests/*.test.js

name: Narromine Hotel Evidence-Grounded Tree Sightlines
on:
  pull_request:
    paths:
      - 'repository-town/src/world/narromine-dandaloo-streetscape*.js'
      - 'repository-town/src/world/narromine-hotel.js'
      - 'repository-town/src/world/narromine.js'
      - 'repository-town/tests/narromine-hotel-tree*.mjs'
      - 'repository-town/tests/narromine-dandaloo-streetscape.mjs'
      - 'repository-town/package.json'
      - '.github/workflows/narromine-hotel-evidence-sightlines.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-geospatial-and-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Geospatial exact-source regression tests
        run: |
          node tests/narromine-dandaloo-streetscape.mjs
          node tests/narromine-hotel-observed-kerbtrees.mjs
      - name: Build browser app and verify privacy
        run: |
          node tools/build.mjs
          node tools/check_privacy.mjs
          node tools/verify-release.mjs dist/public
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Narromine Hotel actual WebGL in desktop and Android-sized browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node tests/narromine-hotel-tree-browser.mjs
      - name: Preserve site-view screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narromine-hotel-real-place-sightlines
          path: repository-town/test-results/narromine-hotel-trees/
          retention-days: 14
          if-no-files-found: warn

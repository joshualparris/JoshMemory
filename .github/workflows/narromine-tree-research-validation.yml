name: Narromine tree research provenance and GIS validation
on:
  pull_request:
    paths:
      - 'repository-town/docs/narromine/trees/**'
      - '.github/workflows/narromine-tree-research-validation.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/docs/narromine/trees/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tree-evidence-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay historical unwanted-deliverable regressions
        run: node --test repository-town/docs/narromine/trees/exclusions.test.mjs
      - name: Validate provenance, WGS84, counts and no invented species
        run: node repository-town/docs/narromine/trees/verify.mjs

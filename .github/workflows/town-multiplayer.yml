name: Repo Town multiplayer two-account protocol
on:
  pull_request:
    paths:
      - 'repository-town/src/multiplayer/**'
      - 'repository-town/tests/multiplayer-live.mjs'
      - 'repository-town/tests/multiplayer-admission.mjs'
      - 'repository-town/tests/multiplayer-browser.mjs'
      - 'repository-town/deploy/multiplayer-worker*'
      - 'repository-town/src/main.js'
      - '.github/workflows/town-multiplayer.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/deploy/multiplayer-worker*'
      - 'repository-town/src/multiplayer/**'
      - 'repository-town/tests/multiplayer-live.mjs'
      - 'repository-town/tests/multiplayer-admission.mjs'
      - 'repository-town/tests/multiplayer-browser.mjs'
      - '.github/workflows/town-multiplayer.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
permissions:
  contents: read
jobs:
  live-two-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser, server and game imports syntax
        run: |
          node --check src/multiplayer/client.js
          node --check src/main.js
          node --check deploy/multiplayer-worker.js
          node --check tests/multiplayer-live.mjs
          node --check tests/multiplayer-admission.mjs
      - name: Verify Worker pending-connection limit using only in-memory sockets
        run: node tests/multiplayer-admission.mjs
      - name: Exercise two different accounts on actual deployed WebSocket server
        env:
          MULTIPLAYER_URL: ${{ github.event_name == 'pull_request' && 'https://repo-town-multiplayer-staging.parris-neathaustralia.workers.dev' || 'https://repo-town-multiplayer.parris-neathaustralia.workers.dev' }}
        run: node tests/multiplayer-live.mjs

  two-browser-avatars:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned game dependencies
        run: npm ci --no-audit --no-fund
      - name: Build real game assets
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Independent real browser avatars (two accounts)
        env:
          MULTIPLAYER_URL: ${{ github.event_name == 'pull_request' && 'https://repo-town-multiplayer-staging.parris-neathaustralia.workers.dev' || 'https://repo-town-multiplayer.parris-neathaustralia.workers.dev' }}
        run: |
          node tools/serve.mjs dist/public 8091 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node tests/multiplayer-browser.mjs --url http://127.0.0.1:8091/

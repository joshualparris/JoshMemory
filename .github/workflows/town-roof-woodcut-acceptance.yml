name: Repository Town roof and woodcut browser acceptance

on:
  pull_request:
    paths:
      - 'repository-town/tests/climb-and-carry-browser.mjs'
      - 'repository-town/tests/woodcutting-browser.mjs'
      - '.github/workflows/town-roof-woodcut-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roof-woodcut-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install exact dependencies and real Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build real game
        run: |
          npm run build
          node tools/check_privacy.mjs
      - name: Walk, jump and physically land; chop and swing on desktop and mobile
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          node tools/serve.mjs dist/public 8091 > /tmp/town-roof-woodcut-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8091/ >/dev/null
          node tests/climb-and-carry-browser.mjs
          node tests/woodcutting-browser.mjs
          node tests/woodcutting-browser.mjs --mobile
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roof-woodcut-acceptance-${{ github.run_id }}
          path: |
            repository-town/test-results/woodlot-*.png
            repository-town/test-results/chop-*.png
            repository-town/test-results/yard-stump-*.png
            repository-town/test-results/fire-*.png
          retention-days: 14
          if-no-files-found: warn

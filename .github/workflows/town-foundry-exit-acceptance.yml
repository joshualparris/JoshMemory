name: Repository Town Foundry physical exit acceptance

on:
  pull_request:
    paths:
      - 'repository-town/tests/life.mjs'
      - '.github/workflows/town-foundry-exit-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/tests/life.mjs'
      - '.github/workflows/town-foundry-exit-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Pinned dependencies and test syntax
        run: |
          npm ci --no-audit --no-fund
          node --check tests/life.mjs
          node tests/traffic-and-shop-exits.mjs
      - name: Build exact proposed 3D game and enforce privacy
        run: |
          npm run build
          npm run check:privacy
      - name: Chromium + software WebGL
        run: npx playwright install --with-deps chromium
      - name: Actual full town-life browser passage including Foundry exit
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          node tools/serve.mjs dist/public 8091 > /tmp/town-foundry-serve.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8091/ >/dev/null
          mkdir -p test-results/foundry-life
          node tests/life.mjs --shots test-results/foundry-life
      - name: Preserve real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-foundry-safe-exit
          path: |
            repository-town/test-results/foundry-life/
            /tmp/town-foundry-serve.log
          retention-days: 7
          if-no-files-found: warn

name: Heritage House Release Verification
on:
  pull_request:
    paths:
      - 'repository-town/tools/heritage-houses.mjs'
      - 'repository-town/tools/build*.mjs'
      - 'repository-town/src/world/props.js'
      - 'repository-town/src/world/exterior.js'
      - 'repository-town/src/world/interior.js'
      - 'repository-town/src/world/builder.js'
      - 'repository-town/src/world/heritage-*'
      - 'repository-town/**/houses*.json'
      - 'repository-town/tests/heritage-*'
      - 'repository-town/package.json'
      - '.github/workflows/town-heritage-verification.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/tools/heritage-houses.mjs'
      - 'repository-town/tools/build*.mjs'
      - 'repository-town/src/world/props.js'
      - 'repository-town/src/world/exterior.js'
      - 'repository-town/src/world/interior.js'
      - 'repository-town/src/world/builder.js'
      - 'repository-town/src/world/heritage-*'
      - 'repository-town/**/houses*.json'
      - 'repository-town/tests/heritage-*'
      - 'repository-town/package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heritage-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate four historical houses and resident guides
        run: node tests/heritage-homes.mjs
      - name: Generate both public and private builds
        run: npm run build
      - name: Check private-data release filters
        run: npm run check:privacy
      - name: Check public house names, sources and unchanged C2
        run: node tests/heritage-public-release.mjs

name: Narromine north furniture evidence
on:
  pull_request:
    paths:
      - 'repository-town/src/world/narromine-dandaloo-streetscape*.js'
      - 'repository-town/tests/narromine-north-furniture-evidence.mjs'
      - '.github/workflows/narromine-north-furniture.yml'
permissions:
  contents: read
jobs:
  north-footpath:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node tests/narromine-dandaloo-streetscape.mjs
      - run: npm run build && npm run check:privacy
      - run: npx playwright install --with-deps chromium
      - name: Walk north footpath and capture desktop and phone views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node tests/narromine-nw-dandaloo-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: north-dandaloo-desktop-phone
          path: repository-town/test-results/nw-dandaloo/
          retention-days: 14

name: Repository Town Recorded WebGL Playtest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'repository-town/**'
      - '.github/workflows/town-webgl-playtest.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/src/**'
      - 'repository-town/tests/**'
      - 'repository-town/tools/**'
      - 'repository-town/package.json'
      - '.github/workflows/town-webgl-playtest.yml'
  workflow_dispatch:
  schedule:
    # Overnight full browser evidence; UTC (02:17 AEST / 03:17 AEDT).
    - cron: '17 16 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: town-recorded-webgl-${{ github.ref }}
  # Never cancel main/release or scheduled evidence runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Decide PR visual testing scope
    runs-on: ubuntu-latest
    outputs:
      high_risk: ${{ steps.scope.outputs.high_risk }}
      narromine: ${{ steps.scope.outputs.narromine }}
    steps:
      - id: scope
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('high_risk','true');
              core.setOutput('narromine','true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100
            });
            const names = files.map(f => f.filename);
            const high = names.some(p => /^repository-town\/(src\/(world|ui|game|simulation)\/|src\/(main|engine|state|input|physics|save|economy)(\/|\.)|tools\/(build|check_privacy)|package(-lock)?\.json|tests\/(webgl-playtest|recorded-dialogue-browser|movement-speed-browser))/.test(p)) ||
              names.some(p => /^\.github\/workflows\/town-(webgl-playtest|integration)\.yml$/.test(p)) ||
              (context.payload.pull_request.labels || []).some(l => l.name === 'town-full-playtest');
            core.setOutput('high_risk', String(high));
            core.setOutput('narromine', String(names.some(p => /narromine|roof|street|building|interior/i.test(p))));
            core.info(`Full PR test: ${high}; Narromine focus: ${names.some(p => /narromine|roof|street|building|interior/i.test(p))}`);

  playable-3d:
    name: Desktop + Android-size recorded WebGL gameplay
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.56.1
      - name: Install system WebGL libraries
        run: npx playwright install-deps chromium
      - name: Install Chromium when uncached
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build actual playable site
        run: npm run build
      - name: Play and record 3D game, fail on missing WebGL
        run: |
          node tools/serve.mjs dist/public 8091 > /tmp/town-playtest-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8091/ > /dev/null
          # The recorded desktop+mobile WebGL smoke is the mandatory PR baseline.
          node tests/webgl-playtest.mjs
          if [[ "${{ github.event_name }}" != 'pull_request' || "${{ needs.classify.outputs.high_risk }}" == 'true' ]]; then
            node tests/recorded-dialogue-browser.mjs
            node tests/movement-speed-browser.mjs
            node tests/exit-facing.mjs
            node tests/town-map-browser.mjs
            node tests/engine-sound-browser.mjs
            node tests/inventory-browser.mjs
            node tests/farmers-market-browser.mjs
            node tests/climb-and-carry-browser.mjs
            node tests/off-road-browser.mjs
            node tests/cheat-menu-browser.mjs
            node tests/yeoval-browser.mjs
            node tests/sleep-browser.mjs
            node tests/sleep-browser.mjs --mobile
          fi
          if [[ "${{ github.event_name }}" == 'pull_request' && "${{ needs.classify.outputs.narromine }}" == 'true' ]]; then
            node tests/narromine-post-office-browser.mjs
          fi
        env:
          TOWN_PLAYTEST_URL: http://127.0.0.1:8091/
          LIBGL_ALWAYS_SOFTWARE: '1'
      # PRs test their own built code, not an unrelated older Vercel deploy.
      # Run the hosted acceptance separately after the release is published.
      - name: Play real hosted production game in Chromium and Pixel 7 emulation
        if: github.event_name == 'workflow_dispatch'
        run: |
          mv test-results/webgl-playtest test-results/webgl-playtest-built
          node tests/webgl-playtest.mjs
        env:
          TOWN_PLAYTEST_URL: https://parris-tech-services.github.io/Repository-town/
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload screenshots, 3D videos and state telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-webgl-playtest-${{ github.run_id }}
          path: |
            repository-town/test-results/webgl-playtest*/
            repository-town/test-results/yeoval-campus/
          retention-days: 14
          if-no-files-found: warn


  browser-shards:
    name: Complete Chrome suite / shard ${{ matrix.shard }}
    needs: classify
    if: github.event_name != 'pull_request' || needs.classify.outputs.high_risk == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.56.1
      - name: Install system WebGL libraries
        run: npx playwright install-deps chromium
      - name: Install Chromium when uncached
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build exact proposed source
        run: npm run build
      - name: Verify all browser tests are represented once
        run: node tools/browser-shards.mjs --check
      - name: Run assigned Chrome browser tests (bounded)
        run: |
          node tools/serve.mjs dist/public 8091 > /tmp/town-full-browser.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8091/ >/dev/null
          timeout 45m node tools/browser-shards.mjs ${{ matrix.shard }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

  full-browser:
    name: Complete Chrome browser regression (bounded)
    needs: [classify, browser-shards]
    if: always() && (github.event_name != 'pull_request' || needs.classify.outputs.high_risk == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: All three browser test shards must pass
        run: test "${{ needs.browser-shards.result }}" = "success"

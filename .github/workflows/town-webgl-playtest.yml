name: Repository Town Recorded WebGL Playtest

on:
  pull_request:
    paths:
      - 'repository-town/**'
      - '.github/workflows/town-webgl-playtest.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/src/**'
      - 'repository-town/tests/webgl-playtest.mjs'
      - 'repository-town/tools/**'
      - 'repository-town/package.json'
      - '.github/workflows/town-webgl-playtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: town-recorded-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playable-3d:
    name: Desktop + Android-size recorded WebGL gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and software rendering libraries
        run: npx playwright install --with-deps chromium
      - name: Build actual playable site
        run: npm run build
      - name: Play and record 3D game, fail on missing WebGL
        run: |
          node tools/serve.mjs dist/public 8091 > /tmp/town-playtest-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8091/ > /dev/null
          node tests/recorded-dialogue-browser.mjs
          node tests/webgl-playtest.mjs
          node tests/movement-speed-browser.mjs
          node tests/exit-facing.mjs
          node tests/town-map-browser.mjs
          node tests/engine-sound-browser.mjs
          node tests/cheat-menu-browser.mjs
          node tests/yeoval-browser.mjs
          node tests/sleep-browser.mjs
          node tests/sleep-browser.mjs --mobile
        env:
          TOWN_PLAYTEST_URL: http://127.0.0.1:8091/
          LIBGL_ALWAYS_SOFTWARE: '1'
      # PRs test their own built code, not an unrelated older Vercel deploy.
      # Run the hosted acceptance separately after the release is published.
      - name: Play real hosted production game in Chromium and Pixel 7 emulation
        if: github.event_name == 'workflow_dispatch'
        run: |
          mv test-results/webgl-playtest test-results/webgl-playtest-built
          node tests/webgl-playtest.mjs
        env:
          TOWN_PLAYTEST_URL: https://parris-tech-services.github.io/Repository-town/
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Upload screenshots, 3D videos and state telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-webgl-playtest-${{ github.run_id }}
          path: |
            repository-town/test-results/webgl-playtest*/
            repository-town/test-results/yeoval-campus/
          retention-days: 14
          if-no-files-found: warn

  full-browser:
    name: Complete Chrome browser regression (bounded)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact proposed source
        run: npm run build
      - name: Run complete browser suite with bounded execution
        run: |
          node tools/serve.mjs dist/public 8091 > /tmp/town-full-browser.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8091/ >/dev/null
          timeout 38m npm run test:browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

name: Repository Town Recorded WebGL Playtest
# Diagnostic branch only: acceptance against the already reviewed hosted release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-lighting:
    name: 38 hosted desktop and Android lighting scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Audit the exact approved hosted lighting release
        run: node tests/lighting-hosted.mjs
        env:
          LIGHTING_HOSTED_URL: https://repository-town-claude-complete.vercel.app/
          LIGHTING_EXPECTED_SOURCE: a7156308945e2c403e1374108fa8a2d6c49737ef
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Preserve hosted screenshots and fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-hosted-lighting-${{ github.run_id }}
          path: repository-town/audit/lighting/hosted/
          retention-days: 14
          if-no-files-found: warn

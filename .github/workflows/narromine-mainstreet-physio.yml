name: Narromine Main Street Physiotherapy Facade

on:
  pull_request:
    paths:
      - 'repository-town/src/world/narromine-mainstreet-physio.js'
      - 'repository-town/src/world/narromine.js'
      - 'repository-town/tests/narromine-mainstreet-physio*.mjs'
      - '.github/workflows/narromine-mainstreet-physio.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/src/world/narromine-mainstreet-physio.js'
      - 'repository-town/src/world/narromine.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photomatched-geometry-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Geometry and geographic provenance test
        run: |
          node --check src/world/narromine-mainstreet-physio.js
          node --check src/world/narromine.js
          node tests/narromine-mainstreet-physio.mjs
          node tests/narromine-facades.mjs
          node tests/narromine-layout.mjs
      - name: Build and privacy check
        run: |
          npm run build
          npm run check:privacy
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture photo-matched facade in desktop and Android-sized game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node tests/narromine-mainstreet-physio-browser.mjs
      - name: Upload browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narromine-physio-desktop-mobile
          path: repository-town/test-results/narromine-physio/
          retention-days: 14
          if-no-files-found: warn

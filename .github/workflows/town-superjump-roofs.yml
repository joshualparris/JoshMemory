name: Repository Town Superjump Building Roofs

on:
  pull_request:
    paths:
      - 'repository-town/src/world/civic-roof-height.js'
      - 'repository-town/src/world/townlife.js'
      - 'repository-town/src/world/narromine.js'
      - 'repository-town/src/world/masterplan-built.js'
      - 'repository-town/src/engine/collision.js'
      - 'repository-town/tests/superjump-building-roofs.mjs'
      - 'repository-town/tests/superjump-building-browser.mjs'
      - 'repository-town/package.json'
      - '.github/workflows/town-superjump-roofs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superjump-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install pinned dependencies and validate syntax
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
          node --check tests/superjump-building-roofs.mjs
          node --check tests/superjump-building-browser.mjs
          node --check src/world/civic-roof-height.js
          node --check src/world/townlife.js
          node --check src/world/narromine.js
          node --check src/engine/collision.js
      - name: Real source jump, rooftop landing, world wall and traffic guards
        run: |
          node tests/superjump-building-roofs.mjs
          node tests/climb-and-carry.mjs
          node tests/movement-speed.mjs
          node tests/narromine-collision-footprints.mjs
          node tests/narromine-footprint-lane-clearance.mjs
          node tests/traffic-and-shop-exits.mjs
      - name: Exact game release build and privacy scan
        run: |
          npm run build
          npm run check:privacy
      - name: Install real Chromium and software WebGL
        run: npx playwright install --with-deps chromium
      - name: Verify actual live building colliders on desktop and mobile
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          node tools/serve.mjs dist/public 8091 > /tmp/town-superjump-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8091/ >/dev/null
          node tests/superjump-building-browser.mjs

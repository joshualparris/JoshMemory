name: Narromine shared doorway tenant-choice acceptance
on:
  pull_request:
    paths:
      - 'repository-town/src/world/narromine-workplaces.js'
      - 'repository-town/src/main.js'
      - 'repository-town/tests/narromine-shared-entrances.mjs'
      - 'repository-town/tests/narromine-shared-entrances-browser.mjs'
      - '.github/workflows/narromine-shared-entrances.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Shared-door 43-record and standalone geometry regression
        run: |
          node tests/narromine-shared-entrances.mjs
          node tests/narromine-workplaces.mjs
      - name: Public build
        run: npm run build
      - name: Browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Actual desktop and Android-size walk-in/out selection
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          node tools/serve.mjs dist/public 8091 >/tmp/shared-doors.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/narromine-shared-entrances-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narromine-shared-door-desktop-android
          path: repository-town/test-results/narromine-shared-entrances/
          retention-days: 7

name: Production offline podcast playback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/offline-podcast-production.mjs'
      - '.github/workflows/offline-podcast-production.yml'
      - 'docs/podcasts*'
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      titles: ${{ steps.catalogue.outputs.titles }}
    steps:
      - uses: actions/checkout@v4
      - id: catalogue
        name: Build direct-audio test matrix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('docs/podcasts.html','utf8');
          const m = html.match(/const podcasts=(\[[\s\S]*?\]);\nconst cats=/);
          if (!m) throw new Error('Podcast catalogue not found');
          const podcasts = vm.runInNewContext(m[1], Object.create(null));
          const titles = podcasts.filter(p => p && p.audio).map(p => p.n);
          if (!titles.length) throw new Error('No direct-audio episodes');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'titles=' + JSON.stringify(titles) + '\n');
          console.log('Direct-audio episodes:', titles.length);
          for (const title of titles) console.log('-', title);
          NODE

  production-offline:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        title: ${{ fromJSON(needs.prepare.outputs.titles) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y pulseaudio ffmpeg
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=offline_test
          pactl set-default-sink offline_test
      - name: Test one production episode offline
        run: node tools/offline-podcast-production.mjs
        env:
          EPISODE_TITLE: ${{ matrix.title }}
          PULSE_SINK: offline_test
      - name: Preserve detailed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-podcast-evidence-${{ strategy.job-index }}
          path: offline-evidence/

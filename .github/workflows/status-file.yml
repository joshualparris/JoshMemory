name: Status file

# Regenerates STATUS.md: a short handover a fresh agent reads first.
# Runs daily and when a task register or the generator changes. It writes only
# STATUS.md, which is not in its trigger paths, so it cannot re-trigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'docs/*.csv'
      - 'tools/build_status.py'
      - '.github/workflows/status-file.yml'
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

concurrency:
  group: status-file
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build STATUS.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_status.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh STATUS.md"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

name: LiDAR grounded tree model WebGL acceptance
on:
  pull_request:
    paths:
      - 'repository-town/src/world/tree-models.js'
      - 'repository-town/src/world/narromine.js'
      - 'repository-town/src/world/town.js'
      - 'repository-town/tests/tree-models.mjs'
      - 'repository-town/tests/tree-models-browser.mjs'
      - 'repository-town/package.json'
      - '.github/workflows/tree-realism-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lidar-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: repository-town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repository-town/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify measured tree positions, LOD and existing collisions
        run: node tests/tree-models.mjs
      - name: Build and verify privacy
        run: |
          node tools/build.mjs
          node tools/check_privacy.mjs
          node tools/verify-release.mjs dist/public
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Render actual desktop and Android tree views
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node tests/tree-models-browser.mjs
      - name: Preserve original game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidar-tree-models-desktop-android
          path: repository-town/test-results/tree-realism/
          retention-days: 14
          if-no-files-found: warn

name: Prepare CC0 storybook character pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'repository-town/tools/prepare-kaykit.mjs'
      - '.github/workflows/prepare-kaykit.yml'
permissions:
  contents: write
concurrency:
  group: prepare-kaykit-character-assets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout JoshMemory main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve official CC0 KayKit assets at audited revision
        run: |
          git clone --filter=blob:none https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git /tmp/town-kaykit
          git -C /tmp/town-kaykit checkout --detach 672074b73ba276876a19e8816ecdc5241817ab47
          test "$(git -C /tmp/town-kaykit rev-parse HEAD)" = "672074b73ba276876a19e8816ecdc5241817ab47"
      - name: Install precise standalone model processing dependencies
        working-directory: repository-town
        run: npm install --ignore-scripts --no-save --package-lock=false '@gltf-transform/core@4.3.0' '@gltf-transform/functions@4.3.0'
      - name: Remove weapons, trim shared-animation GLBs and round-trip validate
        working-directory: repository-town
        run: node tools/prepare-kaykit.mjs /tmp/town-kaykit
      - name: Confirm no unintended source change
        run: |
          git diff --exit-code -- repository-town/package.json repository-town/package-lock.json
          git status --short
      - name: Commit validated binary files, licence and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f repository-town/src/assets/people/kaykit-*.glb repository-town/src/assets/people/kaykit-manifest.json
          if git diff --cached --quiet; then
            echo "Assets already match pinned source"; exit 0
          fi
          git commit -m "assets(town): publish five roundtrip-validated KayKit storybook CC0 residents"
          git push origin HEAD:main

name: Repository Town static server safety
on:
  pull_request:
    paths:
      - 'repository-town/tools/serve.mjs'
      - 'repository-town/tests/static-server-security.mjs'
      - '.github/workflows/repository-town-static-server-safety.yml'
  push:
    branches: [main]
    paths:
      - 'repository-town/tools/serve.mjs'
      - 'repository-town/tests/static-server-security.mjs'
      - '.github/workflows/repository-town-static-server-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localhost-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check server and regression syntax
        working-directory: repository-town
        run: |
          node --check tools/serve.mjs
          node --check tests/static-server-security.mjs
      - name: Verify actual localhost HTTP file serving and fail-closed boundaries
        working-directory: repository-town
        run: node tests/static-server-security.mjs

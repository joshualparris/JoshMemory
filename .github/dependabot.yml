# AutoPatch — dependency update PRs for the explicitly enrolled Repository Town project.
# These settings open PRs and maintain lockfiles; merging and deployment require independent CI/verification.
# Scope: owned Repository Town only. No work/client repositories.
version: 2
updates:
  - package-ecosystem: npm
    directory: /repository-town
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"

  # AutoPatch: nested package-lock.json has real Dependabot advisories.
  - package-ecosystem: npm
    directory: /repository-town/games/joshplatform
    # Routine version updates stay minor/patch; security updates are never restricted.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"


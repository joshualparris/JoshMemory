# AutoPatch — dependency update PRs for the explicitly enrolled Repository Town project.
# These settings open PRs only; no automatic merge or deployment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /repository-town
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(autopatch)"
